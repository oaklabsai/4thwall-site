<body>
<div id="app">

  <!-- ── LEFT RAIL (desktop) — the office as tabs; the chat is the center they drive ── -->
  <aside id="arail" aria-label="Atlas">
    <a class="ar-brand" href="/" aria-label="4THWALL home">
      <svg class="ar-mark" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="square" aria-hidden="true"><polyline points="94.5,5.5 5.5,5.5 5.5,94.5 70,94.5"/><line x1="94.5" y1="5.5" x2="94.5" y2="70"/></svg>
      <b>Atlas</b>
    </a>
    <nav class="ar-nav" id="arNav" aria-label="Atlas sections"></nav>
    <div class="ar-foot">
      <button class="ar-foot-btn" id="arFit" type="button" aria-label="Book a fit call"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="4" width="16" height="15" rx="2"/><path d="M3 8h16M7 2v4M15 2v4"/><path d="M8 13l2.5 2.5L15 11"/></svg><span>Fit call</span></button>
      <button class="ar-foot-btn" id="arTalk" type="button" aria-label="Talk to us"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4 5h14v10H9l-4 3V5z"/></svg><span>Talk to us</span></button>
      <a class="ar-foot-btn" href="/vesta" aria-label="Vesta — the homeowner side"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 10.5 11 4l8 6.5"/><path d="M5 9.5V18h12V9.5"/><path d="M9 18v-4h4v4"/></svg><span>Vesta</span></a>
      <button class="ar-foot-btn" id="arYou" type="button" aria-label="Your account"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="8" r="4"/><path d="M3 20c0-4.418 3.582-8 8-8s8 3.582 8 8"/></svg><span>You</span></button>
    </div>
  </aside>

  <!-- ── CENTER — the Atlas desk is the hub ── -->
  <main id="acenter" role="main">
    <section class="fd" id="home">
      <div class="fd-inner">
        <p class="fd-mat"><span class="kicker" id="fdMat">Welcome!</span></p>
        <div class="fd-chat">
          <p class="fd-you" id="fdYou"></p>
          <h1 class="fd-line" id="fdLine" aria-live="polite"></h1>
          <p class="fd-think" id="fdThink" hidden><span class="fd-shimmer"><i></i><i></i><i></i></span><span id="fdThinkW">reading that</span></p>
          <form class="fd-well" id="fdWell" aria-label="Ask the Atlas desk">
          <span class="fd-in">
            <input type="text" id="fdSay" maxlength="280" autocomplete="off" aria-label="Your ask">
            <span class="fd-ph" id="fdPh" aria-hidden="true"></span>
          </span>
          <button type="button" class="fd-mic" id="fdMic" aria-label="Speak instead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
          <button type="submit" class="fd-send" aria-label="Ask"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h12M10 4l5 5-5 5"/></svg></button>
          </form>
        </div>
        <div class="fd-screen" id="fdScreen" hidden></div>
      </div>
    </section>
  </main>

  <!-- ── MOBILE bottom nav ── -->
  <nav id="abnav" aria-label="Atlas navigation">
    <button class="abn-btn" id="abnOffice" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="2"/><rect x="12" y="2" width="8" height="8" rx="2"/><rect x="2" y="12" width="8" height="8" rx="2"/><rect x="12" y="12" width="8" height="8" rx="2"/></svg>Office</button>
    <button class="abn-btn" id="abnOffer" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2l2.5 5.5L19 8l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>Offer</button>
    <button class="abn-ask" id="abnAsk" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4V5z"/></svg>Ask Atlas</button>
    <button class="abn-btn" id="abnLens" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L19 19"/></svg>Lens</button>
    <button class="abn-btn" id="abnYou" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="8" r="4"/><path d="M3 20c0-4.418 3.582-8 8-8s8 3.582 8 8"/></svg>You</button>
  </nav>

</div>

<script>
/* ══════════ THE ATLAS DESK — app shell (rail + center chat), Vesta's structure. ══════════
   The center IS the conversation; the left rail is the office as tabs. A tab and a typed ask
   are ONE system — both drive the center. Deterministic shell (greet, office, rooms, sim,
   offer, Lens, fit call); the ANSWERS come from /api/atlas (the claim-bounded contractor brain,
   {say, screen}). Model text is DATA: escaped, never markup. Homeowner half omitted by design. */
(function(){
  var CAL='https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ0PiSroPIChYspBn3LWhZ68fw6E7GAhS3wyOziRMBplq5KCxA15lmVzAYTPjmiedJdM9klAvSwE';
  function $(id){return document.getElementById(id)}
  var youEl=$('fdYou'),line=$('fdLine'),say=$('fdSay');
  if(!line||!say)return;
  var mat=$('fdMat');if(mat)mat.textContent='Welcome!';
  function escT(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

  /* ── revenue calculators: math verbatim from atlas.html; exposed globally for the injected
     inline handlers (oninput/onclick). Numbers are computed from the contractor's own inputs. ── */
  function fmt(n){return n>=1000000?'$'+(n/1000000).toFixed(1)+'M':n>=1000?'$'+(n/1000).toFixed(0)+'k':'$'+Math.round(n)}
  window.riSwitchTab=function(id,btn){
    var root=btn.closest('.ri-module')||document;
    [].forEach.call(root.querySelectorAll('.calc-panel'),function(p){p.classList.remove('active')});
    [].forEach.call(root.querySelectorAll('.pill-tab'),function(b){b.classList.remove('active')});
    var panel=$('ri-panel-'+id);if(panel)panel.classList.add('active');btn.classList.add('active');
    if(id==='missed')riCalcMissed();else if(id==='storm')riCalcStorm();else riCalcOffice();
  };
  window.riCalcMissed=function(){
    var jv=+$('ml-jv').value,lw=+$('ml-lw').value,rt=+$('ml-rt').value,cr=+$('ml-cr').value/100,ah=+$('ml-ah').value/100;
    $('ml-jv-d').textContent='$'+jv.toLocaleString();$('ml-lw-d').textContent=lw+' leads';
    $('ml-rt-d').textContent=rt<60?rt+' min':Math.round(rt/60)+' hrs';
    $('ml-cr-d').textContent=Math.round(cr*100)+'%';$('ml-ah-d').textContent=Math.round(ah*100)+'%';
    var slowLoss=rt>30?lw*4*0.25*cr*jv:lw*4*0.1*cr*jv,ahLoss=lw*4*ah*0.6*cr*jv,total=slowLoss+ahLoss;
    $('ml-big').textContent=fmt(total);$('ml-r1').textContent=fmt(slowLoss);$('ml-r2').textContent=fmt(ahLoss);
    $('ml-r3').textContent=fmt(total*12);$('ml-r4').textContent=fmt(total*0.72);
  };
  window.riCalcStorm=function(){
    var ev=+$('st-ev').value,lp=+$('st-lp').value,jv=+$('st-jv').value,cr=+$('st-cr').value/100,dr=+$('st-dr').value/100;
    $('st-ev-d').textContent=ev+' events';$('st-lp-d').textContent=lp+' leads';$('st-jv-d').textContent='$'+jv.toLocaleString();
    $('st-cr-d').textContent=Math.round(cr*100)+'%';$('st-dr-d').textContent=Math.round(dr*100)+'%';
    var total=ev*lp,dropped=Math.round(total*dr),captured=total-dropped;
    var rev=captured*cr*jv,lost=dropped*cr*jv,withAtlas=total*cr*jv;
    $('st-big').textContent=fmt(rev);$('st-r1').textContent=total+' leads';$('st-r2').textContent=dropped+' leads';
    $('st-r3').textContent=fmt(lost);$('st-r4').textContent=fmt(withAtlas);
  };
  window.riCalcOffice=function(){
    var lw=+$('om-lw').value,wg=+$('om-wg').value,hr=+$('om-hr').value;
    $('om-lw-d').textContent=lw+' leads';$('om-wg-d').textContent='$'+wg+'/hr';$('om-hr-d').textContent=hr+' hrs';
    var base=wg*hr*52/12,overhead=base*0.28,total=base+overhead;
    $('om-big').textContent=fmt(total);$('om-r1').textContent=fmt(base);$('om-r2').textContent=fmt(overhead);
    $('om-r3').textContent=hr+' hrs/week';$('om-r4').textContent='0 hrs';$('om-r5').textContent='24/7 · bilingual';
  };
  var riCalcMissed=window.riCalcMissed,riCalcStorm=window.riCalcStorm,riCalcOffice=window.riCalcOffice;

  var GREET='You do the work. Atlas runs the office around it. Ask me anything — <a data-say="what does Atlas do?">what it does</a>, <a data-say="how does the offer work?">the offer</a>, <a data-say="I keep missing calls on the job">a problem you’re having</a> — or <a data-say="walk the office">walk the office</a>.';
  var OFFICE_LINE='This is the office Atlas runs around your work. Walk any room — or ask about <a data-say="how does storm season work?">storm season</a>, <a data-say="how do you handle reviews?">reviews</a>, or <a data-say="how does the offer work?">the offer</a>.';
  var DEFLECT='That one deserves a person, not a guess — <a href="'+CAL+'" target="_blank" rel="noopener">book a 20-minute fit call</a> and ask the founder directly.';

  /* ── per-letter blur reveal ── */
  function letterize(container){
    var seq=0;
    (function walk(node){
      [].slice.call(node.childNodes).forEach(function(ch){
        if(ch.nodeType===3){
          var frag=document.createDocumentFragment();
          ch.textContent.split(/(\s+)/).forEach(function(tok){
            if(!tok)return;
            if(/^\s+$/.test(tok)){frag.appendChild(document.createTextNode(' '));return}
            var w=document.createElement('span');w.className='w';
            for(var i=0;i<tok.length;i++){var l=document.createElement('i');l.textContent=tok[i];l.style.transitionDelay=Math.min(seq++*13,1300)+'ms';w.appendChild(l)}
            frag.appendChild(w);
          });
          node.replaceChild(frag,ch);
        } else if(ch.nodeType===1) walk(ch);
      });
    })(container);
  }
  var speakEnds=0;
  function landAfterSay(fn){setTimeout(fn,Math.max(0,(speakEnds||0)-Date.now()))}
  function speak(html,extra){
    var _plain=html.replace(/<[^>]+>/g,'').length;
    speakEnds=Date.now()+(line.querySelectorAll('.w i').length?430:0)+Math.min(_plain*13,1300)+650;
    var old=line.querySelectorAll('.w i'),wait=0;
    if(old.length){for(var i=0;i<old.length;i++)old[i].style.transitionDelay=Math.min((old.length-i)*5,320)+'ms';line.classList.remove('in');line.classList.add('out');wait=430}
    setTimeout(function(){
      line.innerHTML='<span>'+html.replace(/(<a[^>]*>[^<]*<\/a>)([,.?!;:—]*)/g,'<span class="nw">$1$2</span>')+(extra||'')+'</span>';
      line.classList.toggle('long',html.indexOf('<br>')!==-1);
      letterize(line);
      line.classList.remove('out');void line.offsetWidth;line.classList.add('in');
      [].forEach.call(line.querySelectorAll('a[data-say]'),function(a){a.addEventListener('click',function(e){e.preventDefault();input(a.getAttribute('data-say'),a.textContent)})});
    },wait);
  }
  function echo(t){youEl.textContent='“'+t+'”';youEl.className='fd-you';void youEl.offsetWidth;youEl.className='fd-you show'}

  /* ── the assembled screen ── */
  var screen=$('fdScreen');
  function paintScreen(html,instant){
    screen.hidden=false;screen.classList.remove('in');screen.innerHTML=html;
    [].forEach.call(screen.children,function(c,i){c.style.transitionDelay=instant?'0ms':Math.min(i*80,640)+'ms'});
    void screen.offsetWidth;screen.classList.add('in');
    var fd=$('home');if(fd&&!fd.classList.contains('staged'))fd.classList.add('staged');
  }
  function showScreen(html,wire){
    if(screen.hidden||!document.startViewTransition||document.visibilityState!=='visible'){paintScreen(html,false);if(wire)wire();return}
    try{var vt=document.startViewTransition(function(){paintScreen(html,true);if(wire)wire()});if(vt&&vt.finished&&vt.finished.catch)vt.finished.catch(function(){})}
    catch(e){paintScreen(html,false);if(wire)wire()}
  }

  /* ══ THE OFFICE — eight rooms ══ */
  var ROOMS={
    lead:{t:'Lead Response',d:'Every call and text answered and qualified — around the clock, in English or Spanish.',
      deep:'When you can’t pick up, Atlas follows up by text right away. The approved questions get asked — what happened, where, how urgent — and supported texts typically get a first reply in 15 seconds after go-live.',sim:true},
    storm:{t:'Storm Mode',d:'Storm volume, the same operating standard.',
      deep:'When inbound calls and texts surge after a storm, Atlas works the conversations concurrently — instead of leaving a stack of voicemails for the end of the day. The busiest week of your year runs like a normal one.'},
    camp:{t:'Seasonal Campaigns',d:'Your market’s seasons, worked on schedule.',
      deep:'Campaigns built around your market’s rhythm — storm response, renovation windows, inspection cycles. Written, scheduled, and sent without you touching a keyboard.'},
    book:{t:'Booking &amp; Scheduling',d:'Qualified estimates, on the calendar, context attached.',
      deep:'When a lead qualifies, Atlas can place the estimate directly on your calendar — with what happened, where, and how urgent already written up for you.'},
    follow:{t:'Follow-up',d:'Quotes chased, quiet leads revived.',
      deep:'The quote you sent Tuesday gets followed up on. The lead that went quiet in March gets a reason to come back. Nothing dies in a notebook.'},
    reviews:{t:'Review Generation',d:'The ask, at the moment the job closes.',
      deep:'Reviews come from asking at the right moment. Atlas sends the request when the job closes, every time — the record compounds instead of evaporating.'},
    local:{t:'Local Discovery',d:'The signals that make good work findable, kept current.',
      deep:'Your pages, listings, and local signals — maintained as part of the office, not sold as an add-on. Clearer facts for the systems homeowners actually search with; honest work, honestly findable.'},
    briefs:{t:'Operator Briefs',d:'It watches your week before you think to ask.',
      deep:'Atlas watches for storm threats in your market, notices when a lead goes quiet, and counts your week before you think to look. It’s not waiting for a question — it’s already thinking about your business.'}
  };
  function svg(inner){return '<div class="cf-diag"><svg viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg></div>'}
  var DIAG={
    lead:svg('<rect x="6" y="8" width="20" height="24" rx="3"/><path d="M40 14 h58"/><path d="M90 8 l8 6 -8 6"/><path d="M98 26 h-58"/><path d="M48 32 l-8-6 8-6"/>'),
    storm:svg('<path d="M8 18 a10 8 0 0 1 20 -2 a7 6 0 0 1 4 12 H12 a8 7 0 0 1 -4 -10z"/><path d="M44 10 v22 M60 10 v22 M76 10 v22 M92 10 v22"/>'),
    camp:svg('<rect x="6" y="10" width="30" height="24" rx="3"/><path d="M6 18 h30 M14 6 v6 M28 6 v6"/><path d="M50 22 h48"/><path d="M90 15 l8 7 -8 7"/><path d="M98 22 a20 20 0 0 1 -20 18" stroke-dasharray="3 4"/>'),
    book:svg('<rect x="6" y="10" width="34" height="26" rx="3"/><path d="M6 18 h34 M16 6 v6 M32 6 v6"/><path d="M52 24 l7 7 14 -16"/><path d="M84 24 l7 7 14 -16"/>'),

  function cfCards(items){
    var cards=items.map(function(it){
      return '<div class="cf-card" data-cf-card="'+it.key+'"><span class="cf-num">'+it.num+'</span>'+
        '<span class="cf-title">'+it.title+'</span><p class="cf-desc">'+it.desc+'</p>'+(it.diag||'')+'<span class="cf-go">'+it.go+'</span></div>';
    }).join('');
    return '<div class="cf-wrap"><div class="cf-stage">'+cards+'</div></div>'+
      '<div class="cf-nav"><button class="cf-arrow" data-cf="prev" aria-label="Previous">‹</button><div class="cf-dots"></div><button class="cf-arrow" data-cf="next" aria-label="Next">›</button></div>';

  function officeItems(keys){return keys.map(function(k,i){var r=ROOMS[k];return {key:k,num:(i<9?'0':'')+(i+1)+' · the office',title:r.t,desc:r.d,diag:DIAG[k]||'',go:'step into this room →'}})}
  function wireCoverflow(keys,root,onOpen){
    if(!root||!root.querySelector)return;
    var stage=root.querySelector('.cf-stage');if(!stage)return;
    var cards=[].slice.call(stage.querySelectorAll('[data-cf-card]'));var n=cards.length;if(!n)return;
    var cw=stage.offsetWidth||280,active=0;
    var dotsEl=root.querySelector('.cf-dots'),dots=[];
    cards.forEach(function(c,i){
      c.addEventListener('click',function(){i===active?(onOpen&&onOpen(keys[i],i)):setA(i)});
      if(dotsEl){var d=document.createElement('button');d.className='cf-dot';d.setAttribute('aria-label','Card '+(i+1));d.addEventListener('click',function(){setA(i)});dotsEl.appendChild(d);dots.push(d)}
    });
    function setA(a){active=((a%n)+n)%n;layout()}
    function layout(){
      cards.forEach(function(c,i){
        var rel=i-active;if(rel>n/2)rel-=n;if(rel<-n/2)rel+=n;
        var ax=Math.abs(rel),vis=ax<=2;
        var sc=Math.max(0.4,1-ax*0.16),tx=rel*(cw*0.66),tz=-ax*(cw*0.72),ry=-rel*12,rz=rel*8;
        c.style.transform='translate(-50%,-50%) translateX('+tx+'px) translateZ('+tz+'px) rotateY('+ry+'deg) rotateZ('+rz+'deg) scale('+sc+')';
        c.style.opacity=vis?'1':'0';c.style.pointerEvents=vis?'auto':'none';c.classList.toggle('active',rel===0);c.style.zIndex=String(100-ax);
      });
      dots.forEach(function(d,i){d.classList.toggle('on',i===active)});
    }
    [].forEach.call(root.querySelectorAll('[data-cf]'),function(b){b.addEventListener('click',function(){setA(active+(b.getAttribute('data-cf')==='next'?1:-1))})});
    layout();
  }

      setTimeout(step,s[0]==='me'?1500:2000);
    }
  }

          '<input type="checkbox" id="cm-sms-transactional" name="sms_transactional_consent">'+
          '<label for="cm-sms-transactional" class="consent-text">By checking this box, I consent to receive <strong>transactional</strong> and service-related SMS messages from <strong>4th Wall Solutions / Andres Rendon</strong>, including appointment reminders, job status updates, lead follow-ups, customer support messages, and other information related to services I have requested. Message frequency may vary. Message and data rates may apply. Reply <strong>HELP</strong> for help or <strong>STOP</strong> to opt out at any time.</label>'+
        '</div><div class="consent-check" style="margin-top:.5rem">'+
          '<input type="checkbox" id="cm-sms-marketing" name="sms_marketing_consent">'+
          '<label for="cm-sms-marketing" class="consent-text">By checking this box, I consent to receive <strong>marketing</strong> and promotional SMS messages from <strong>4th Wall Solutions / Andres Rendon</strong>, including promotional offers, discount, new product updates, announcements, and special promotions. Message frequency may vary. Message and data rates may apply. Reply <strong>HELP</strong> for help or <strong>STOP</strong> to opt out at any time.</label>'+
        '</div><p class="consent-text" style="margin-top:.75rem;text-align:center"><a href="/privacy.html">Privacy Policy</a> | <a href="/terms.html">Terms of Service</a></p></div>'+
      '</form>'+
      '<div class="composer-sub"><span><a href="mailto:andrew@4thwall.solutions">andrew@4thwall.solutions</a></span><span><a href="tel:+12036709477">(203) 670-9477</a></span><span>U.S. based · Eastern time</span></div>'+
      '<div class="fds-doors"><a href="'+CAL+'" target="_blank" rel="noopener">or book the fit call →</a><a data-door="office">← the office</a></div>';
  }
  function assembleContact(){ showScreen(contactHTML(),function(){wireComposer();wireScreenDoors()}) }
  /* composer chips + submit — ported from site.js (not loaded in the app build) */
  function wireComposer(){
    var chips=[].slice.call(screen.querySelectorAll('#cm-chips .chip'));
    chips.forEach(function(chip){chip.addEventListener('click',function(){
      chips.forEach(function(c){c.classList.remove('active')});chip.classList.add('active');
      var t=$('cm-trade');if(t)t.value=chip.getAttribute('data-chip')||'';
    })});
    var form=$('composer-form');if(!form)return;
    form.addEventListener('submit',function(e){e.preventDefault();
      var send=$('cm-send'),msg=$('cm-msg');
      var cM=form.querySelector('input[name="sms_marketing_consent"]'),cT=form.querySelector('input[name="sms_transactional_consent"]');
      var orig=send.textContent;send.textContent='…';send.disabled=true;
      var fd=new FormData(form),body={};fd.forEach(function(v,k){body[k]=v});
      body.sms_marketing_consent=cM&&cM.checked?'true':'false';
      body.sms_transactional_consent=cT&&cT.checked?'true':'false';
      fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)})
      .then(function(r){if(!r.ok)throw new Error('submit failed: '+r.status);
        send.classList.add('sent');send.textContent='✓';form.reset();
        chips.forEach(function(c){c.classList.remove('active')});
        msg.placeholder='Got it — Andrew will reply within an hour during business hours.';
        setTimeout(function(){send.classList.remove('sent');send.textContent=orig;send.disabled=false},4500);
      }).catch(function(){send.textContent=orig;send.disabled=false;
        msg.placeholder="Couldn’t send — email andrew@4thwall.solutions or call (203) 670-9477.";});
    });
  }

  function wireScreenDoors(){
    var o=screen.querySelector('[data-door="office"]');if(o)o.addEventListener('click',function(e){e.preventDefault();openTab('office')});
    var s=screen.querySelector('[data-door="sim"]');if(s)s.addEventListener('click',function(e){e.preventDefault();openTab('sim')});
    var l=screen.querySelector('[data-door="lens"]');if(l)l.addEventListener('click',function(e){e.preventDefault();openTab('lens')});
    var f=screen.querySelector('[data-door="fitcall"]');if(f)f.addEventListener('click',function(e){e.preventDefault();openTab('fitcall')});
    var c=screen.querySelector('[data-door="contact"]');if(c)c.addEventListener('click',function(e){e.preventDefault();openTab('contact')});
  }
  function assembleScreen(s){
    if(s==='office')return assembleOffice();
    if(s&&s.indexOf('room:')===0)return roomVisual(s.slice(5));
    if(s==='sim')return simVisual();
    if(s==='offer')return offerVisual();
    if(s==='lens')return lensVisual();
    if(s==='fitcall')return fitcallVisual();
    if(s==='numbers')return assembleRevenue();
    if(s==='faq')return assembleFAQ();
    if(s==='contact')return assembleContact();
  }

  /* clicks (no model say) — the desk narrates, then assembles */
  function enterRoom(k){var r=ROOMS[k];if(!r)return walkOffice();
    setTalking(true);setActive('room:'+k);
    speak('<b>'+r.t+'</b> — '+r.d+' Walk <a data-say="walk the office">back through the office</a> anytime.');
    landAfterSay(function(){roomVisual(k)});}
  function walkOffice(){setTalking(true);setActive('office');speak(OFFICE_LINE);landAfterSay(assembleOffice)}
  var TAB_LINE={
    offer:'Here’s how the offer works — a managed service, not a software seat. The number follows the size of the front office we run for you, set on a 20-minute fit call in plain terms.',
    lens:'Lens is your free, private trust workspace — connect the tools you already run, review every fact your record supports, and control exactly what a homeowner could see. Nothing publishes without you.',
    fitcall:'The next step is a 20-minute fit call with the founder — we show the office working on your business, in plain numbers, and set the fee from there.',
    numbers:'Here are the calculators — the real cost of slow replies, storm seasons, and hiring for the desk. Move the sliders; the math is yours, from your own numbers.',
    faq:'The common questions, answered plainly — what’s included, whether it’s another tool to learn, how fast it goes live, and how to stop.',
    contact:'Tell us what’s on fire — a message reaches the founder directly. Or book the fit call any time.',
    sim:'Here’s a missed call coming back — a simulation, labeled as one. Watch it play out.'
  };
  function openTab(key){
    if(key==='office')return walkOffice();
    if(key&&key.indexOf('room:')===0)return enterRoom(key.slice(5));
    setTalking(true);setActive(key);
    if(TAB_LINE[key])speak(TAB_LINE[key]);
    landAfterSay(function(){assembleScreen(key)});
  }

  /* ══ THE MODEL LOOP — typed asks -> /api/atlas ══ */
  var msgs=[],busy=false;
  var THINKS=['reading that','thinking it through','checking the record','lining it up'],thinkTimer=null;
  var think=$('fdThink'),thinkW=$('fdThinkW');
  function thinkOn(){var i=0;if(thinkW)thinkW.textContent=THINKS[0];if(think)think.hidden=false;thinkTimer=setInterval(function(){i=(i+1)%THINKS.length;if(thinkW)thinkW.textContent=THINKS[i]},2600)}
  function thinkOff(){if(think)think.hidden=true;clearInterval(thinkTimer);thinkTimer=null}
  function ask(q){
    busy=true;thinkOn();
    msgs.push({role:'user',content:q});
    fetch('/api/atlas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs.slice(-14)})})
    .then(function(r){return r.json()})
    .then(function(d){
      busy=false;thinkOff();
      var s=(d&&typeof d.say==='string')?d.say.trim():'';var scr=(d&&typeof d.screen==='string')?d.screen:null;
      if(!s){speak(DEFLECT);return}
      msgs.push({role:'assistant',content:s});
      speak(escT(s));
      if(scr){setActive(scr);landAfterSay(function(){assembleScreen(scr)})}
    })
    .catch(function(){busy=false;thinkOff();speak(DEFLECT)});
  }
  function input(q,display){
    if(busy)return;
    simGen++;setTalking(true);setActive(null);echo(display||q);
    if(/^\s*(walk the office|the office|back to the office|every room)\s*$/i.test(q)){walkOffice();return}
    ask(q);
  }
  $('fdWell').addEventListener('submit',function(e){e.preventDefault();var q=say.value.trim();if(!q)return;say.value='';phVis();input(q)});

  /* ── placeholder cycling ── */
  var PH=['I keep missing calls on the job','what does Atlas do?','how does storm season work?','what does it cost?','how do you handle reviews?','what is Lens?'];
  var phEl=$('fdPh'),phIdx=0;
  function phShow(text){phEl.innerHTML='';for(var i=0;i<text.length;i++){var sp=document.createElement('i');sp.textContent=text[i]===' '?' ':text[i];sp.style.transitionDelay=(i*18)+'ms';phEl.appendChild(sp)}phEl.classList.remove('out');void phEl.offsetWidth;phEl.classList.add('in')}
  function phVis(){phEl.style.opacity=(say.value||document.activeElement===say)?'0':'1'}
  say.addEventListener('focus',phVis);say.addEventListener('blur',phVis);say.addEventListener('input',phVis);
  if(phEl){phShow(PH[0]);setInterval(function(){if(say.value||document.activeElement===say)return;var els=phEl.querySelectorAll('i');for(var i=0;i<els.length;i++){els[i].style.transitionDelay=((els.length-i)*10)+'ms'}phEl.classList.remove('in');phEl.classList.add('out');setTimeout(function(){phIdx=(phIdx+1)%PH.length;phShow(PH[phIdx])},400)},3600)}

  /* ── mic ── */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,micBtn=$('fdMic');
  if(SR&&micBtn){var rec=null;micBtn.addEventListener('click',function(){
    if(rec){try{rec.stop()}catch(e){}return}
    rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;micBtn.classList.add('listening');
    rec.onresult=function(e){say.value=e.results[0][0].transcript;phVis()};
    rec.onend=function(){micBtn.classList.remove('listening');rec=null;if(say.value)$('fdWell').dispatchEvent(new Event('submit',{cancelable:true}))};
    rec.onerror=function(){micBtn.classList.remove('listening');rec=null};
    try{rec.start()}catch(e){micBtn.classList.remove('listening');rec=null}
  })}else if(micBtn){micBtn.style.display='none'}

  /* ── talking state ── */
  var talking=false;
  function setTalking(v){talking=v;var fd=$('home');if(fd)fd.classList.toggle('talking',v)}

  /* ══ THE RAIL — the office as tabs; a tab drives the center in tandem with the chat ══ */
  var IC={
    office:'<rect x="2" y="2" width="8" height="8" rx="2"/><rect x="12" y="2" width="8" height="8" rx="2"/><rect x="2" y="12" width="8" height="8" rx="2"/><rect x="12" y="12" width="8" height="8" rx="2"/>',
    lead:'<path d="M3 5h13v9H8l-4 3V5z"/><path d="M19 9v7l-3-2"/>',
    storm:'<path d="M4 13a4 4 0 0 1 1-7.9A5.5 5.5 0 0 1 16 6a3.5 3.5 0 0 1 .5 7"/><path d="M11 12l-2 4h4l-2 4"/>',
    camp:'<rect x="3" y="4" width="16" height="16" rx="2"/><path d="M3 9h16M8 2v4M14 2v4"/>',
    book:'<rect x="3" y="4" width="16" height="16" rx="2"/><path d="M3 9h16M8 2v4M14 2v4"/><path d="M8 14l2.5 2.5L15 12"/>',
    follow:'<path d="M4 14h9a4 4 0 0 0 0-8H6"/><path d="M8 3 4 6l4 3"/>',
    reviews:'<path d="M11 3l2.4 5 5.6.6-4 3.8 1 5.6L11 16l-5 3 1-5.6-4-3.8 5.6-.6z"/>',
    local:'<path d="M11 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="11" cy="10" r="2.5"/>',
    briefs:'<path d="M3 20h18"/><rect x="4" y="12" width="3" height="6"/><rect x="9.5" y="7" width="3" height="11"/><rect x="15" y="14" width="3" height="4"/>',
    offer:'<path d="M11 3H5a2 2 0 0 0-2 2v6l9 9 8-8-9-9z"/><circle cx="8" cy="8" r="1.4"/>',
    lens:'<circle cx="9.5" cy="9.5" r="6.5"/><path d="M14.5 14.5 20 20"/>',
    faq:'<circle cx="11" cy="11" r="8"/><path d="M9 8.8a2 2 0 1 1 3 1.8c-.7.5-1 .8-1 1.6"/><circle cx="11" cy="15.4" r=".7" fill="currentColor" stroke="none"/>',
    sim:'<rect x="5" y="2" width="12" height="18" rx="2.5"/><path d="M9.4 12.6l4.4-4.4M13.8 12.6L9.4 8.2"/>',
    numbers:'<rect x="4" y="2" width="14" height="18" rx="2.2"/><path d="M7 6h8M7 10h2M11 10h4M7 14h2M11 14h4"/>',
    contact:'<path d="M20 3 3 10.5l6 2 2 6L20 3z"/><path d="M11 12.5 20 3"/>'
  };
  var RAIL=[
    {group:'The office'},
    {key:'office',label:'Walk the office',ic:'office'},
    {key:'room:lead',label:'Lead Response',ic:'lead'},
    {key:'room:storm',label:'Storm Mode',ic:'storm'},
    {key:'room:camp',label:'Seasonal Campaigns',ic:'camp'},
    {key:'room:book',label:'Booking',ic:'book'},
    {key:'room:follow',label:'Follow-up',ic:'follow'},
    {key:'room:reviews',label:'Reviews',ic:'reviews'},
    {key:'room:local',label:'Local Discovery',ic:'local'},
    {key:'room:briefs',label:'Operator Briefs',ic:'briefs'},
    {group:'Working together'},
    {key:'offer',label:'The offer',ic:'offer'},
    {key:'lens',label:'Lens — your record',ic:'lens'},
    {key:'faq',label:'Common questions',ic:'faq'},
    {group:'See it work'},
    {key:'sim',label:'Watch a missed call',ic:'sim'},
    {key:'numbers',label:'The numbers',ic:'numbers'}
  ];
  function icoSvg(k){return '<span class="ar-ic"><svg viewBox="0 0 22 22" aria-hidden="true">'+(IC[k]||'')+'</svg></span>'}
  function buildRail(){
    var nav=$('arNav');if(!nav)return;
    nav.innerHTML=RAIL.map(function(r){
      if(r.group)return '<span class="ar-glabel squig-under">'+r.group+'</span>';
      return '<button class="ar-item" type="button" data-tab="'+r.key+'">'+icoSvg(r.ic)+'<span class="ar-lbl">'+r.label+'</span></button>';
    }).join('');
    [].forEach.call(nav.querySelectorAll('[data-tab]'),function(b){b.addEventListener('click',function(){openTab(b.getAttribute('data-tab'))})});
  }
  function setActive(key){
    [].forEach.call(document.querySelectorAll('#arNav [data-tab]'),function(b){b.classList.toggle('on',b.getAttribute('data-tab')===key)});
    var map={office:'abnOffice',offer:'abnOffer',lens:'abnLens'};
    ['abnOffice','abnOffer','abnLens'].forEach(function(id){var el=$(id);if(el)el.classList.toggle('on',map[key]===id)});
  }
  buildRail();

  /* foot + bottom-nav wiring */
  function wire(id,fn){var el=$(id);if(el)el.addEventListener('click',fn)}
  wire('arFit',function(){openTab('fitcall')});
  wire('arTalk',function(){openTab('contact')});
  wire('arYou',function(){setTalking(true);setActive(null);speak('Accounts live in Lens — your free, private workspace. <a href="/lens">Open Lens</a>, or <a data-say="how does the offer work?">hear the offer</a>.')});
  wire('abnOffice',function(){openTab('office')});
  wire('abnOffer',function(){openTab('offer')});
  wire('abnLens',function(){openTab('lens')});
  wire('abnAsk',function(){try{say.focus()}catch(e){}});
  wire('abnYou',function(){setTalking(true);setActive(null);speak('Accounts live in Lens — your free, private workspace. <a href="/lens">Open Lens</a>.')});
  document.body.classList.add('abn-showing');

  /* ── boot: the desk greets; the office is a tab away, not forced on arrival ──
     deep-link: the homepage office deck routes here as /atlas?tab=room:<key> (or offer/lens/
     numbers/faq/contact/sim) — arrive already inside that surface, with the greeting behind it */
  var DEEPLINK=/^(office|offer|lens|faq|numbers|contact|sim|fitcall|room:(lead|storm|camp|book|follow|reviews|local|briefs))$/;
  var _qtab=null;try{_qtab=new URLSearchParams(location.search).get('tab')}catch(e){}
  speak(GREET);
  if(_qtab&&DEEPLINK.test(_qtab))setTimeout(function(){openTab(_qtab)},700);
})();
</script>

</body>
