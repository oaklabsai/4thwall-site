<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contractors in Fairfield County, CT — by public record | Vesta</title>
<meta name="description" content="The most-established contractors in Fairfield County, Connecticut — vouched by state registration, with a plain read of what homeowners actually say. Compiled by Vesta from public records. No ads, no pay-to-play.">
<link rel="canonical" href="https://4thwall.solutions/fairfield-county/roofing">
<link rel="icon" href="/logo.png" type="image/png">
<meta name="theme-color" content="#0f1310">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional" rel="stylesheet">
<link rel="stylesheet" href="/home.css">
<style>
  /* .card-syn / .syn-lbl now live in home.css (shared with /vesta search). */
  .dir-count{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--vdim)}
</style>
<script src="/home.js" defer></script>
</head>
<body class="v-dark">

<nav class="topnav">
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="square">
      <polyline points="94.5,5.5 5.5,5.5 5.5,94.5 70,94.5"/>
      <line x1="94.5" y1="5.5" x2="94.5" y2="70"/>
    </svg>
    4THWALL<span class="home-tag">VESTA</span>
  </a>
  <div class="nav-links">
    <a href="/vesta" class="nav-a">Find a pro</a>
    <span id="nav-acct"><a class="nav-a" href="/signin">Sign in</a></span>
  </div>
</nav>

<main>
<section class="page-hero" id="hero">
  <div class="loading">Loading…</div>
</section>
<section class="section" id="body"></section>
</main>

<footer>
  <div class="foot-row">
    <span class="foot-brand">4th Wall Solutions · Stamford, CT</span>
    <div class="foot-links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
    </div>
  </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', async function(){
  HOME.navAccount();
  const esc = HOME.esc;
  const hero = document.getElementById('hero');
  const body = document.getElementById('body');
  const COUNTY = 'Fairfield County';

  // Vesta's canonical trade categorization — mirror of vesta.html (icons + tLabel).
  // Reuse it; never invent a parallel set.
  const I = {
    all:        '<path d="M3 12h18M3 6h18M3 18h18"/>',
    roofing:    '<path d="M2.5 11.5 12 3.5l9.5 8"/><path d="M5.5 9.4V20h13V9.4"/><path d="M15.5 6.6V4.5h2.5v4.1"/>',
    paving:     '<path d="M7.5 4 4.5 20"/><path d="M16.5 4l3 16"/><path d="M12 5.5v2.6"/><path d="M12 11.2v2.6"/><path d="M12 16.9v2.6"/>',
    hvac:       '<circle cx="12" cy="13" r="7.5"/><path d="M12 13l3.2-3.2"/><path d="M12 5.5V4"/><path d="M4.5 13H3"/><path d="M21 13h-1.5"/>',
    plumbing:   '<path d="M12 3.5s6 6.4 6 10.2a6 6 0 0 1-12 0C6 9.9 12 3.5 12 3.5Z"/>',
    electrical: '<path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2Z"/>',
    lawn_care:  '<path d="M12 20.5V13"/><path d="M12 14.5C12 10.5 9 8.5 5 8.5c0 4 3 6 7 6Z"/><path d="M12 12.5c0-4 3-6 7-6 0 4-3 6-7 6Z"/>',
    painting:   '<rect x="3.5" y="4" width="11" height="6" rx="1.5"/><path d="M14.5 7h3.5a1.5 1.5 0 0 1 1.5 1.5v1a1.5 1.5 0 0 1-1.5 1.5h-6a1.2 1.2 0 0 0-1.2 1.2V14"/><rect x="9.3" y="14" width="3.6" height="6" rx="1"/>',
    masonry:    '<rect x="3.5" y="5" width="17" height="14" rx="1"/><path d="M3.5 9.7h17M3.5 14.3h17M9 5v4.7M14.5 5v4.7M6.2 9.7v4.6M11.8 9.7v4.6M17.3 9.7v4.6M9 14.3V19M14.5 14.3V19"/>',
    tree_service: '<circle cx="12" cy="9.5" r="5.5"/><path d="M12 15v5.5"/><path d="M9.5 20.5h5"/><path d="M12 12.5 9.8 10.3M12 10.5l1.9-1.9"/>'
  };
  const tLabel = t => t === 'hvac' ? 'HVAC' : HOME.tradeLabel(t);
  const tLower = t => t === 'hvac' ? 'HVAC' : HOME.tradeLabel(t).toLowerCase();

  // The trade strip — the SAME categorization Vesta uses, as links between county directories.
  function stripHtml(active){
    return '<nav class="va-strip" aria-label="Trades in Fairfield County">' + HOME.TRADES.map(t =>
      '<a class="va-tile' + (t === active ? ' on' : '') + '" href="/fairfield-county/' + t + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' + (I[t] || I.all) + '</svg>' +
        '<span class="tn">' + esc(tLabel(t)) + '</span>' +
        '<span class="tc' + (t === active ? ' has' : '') + '">' + (t === active ? 'Showing' : 'View') + '</span>' +
      '</a>').join('') + '</nav>';
  }

  const slug = (location.pathname.match(/^\/fairfield-county\/([a-z_]+)\/?$/) || [])[1] || '';
  const trade = HOME.TRADES.includes(slug) ? slug : '';
  if (!trade){
    hero.innerHTML = '<a class="crumb" href="/vesta">← Vesta</a>' +
      '<h1 class="page-h">Contractors in ' + COUNTY + ', CT</h1>' +
      '<p class="page-sub">Pick a trade to see the most-established pros across ' + COUNTY + ', vouched by the public record.</p>';
    body.innerHTML = stripHtml('');
    return;
  }
  const label = tLabel(trade);

  // SEO: title / description / canonical for this trade (Googlebot renders this).
  document.title = label + ' Contractors in Fairfield County, CT — by public record | Vesta';
  const canon = document.querySelector('link[rel=canonical]'); if (canon) canon.href = 'https://4thwall.solutions/fairfield-county/' + trade;
  const desc = document.querySelector('meta[name=description]');
  if (desc) desc.content = 'The top ' + tLower(trade) + ' contractors in Fairfield County, CT — ranked by what homeowners actually say, weighted by how many said it, with a plain-English read of each. Compiled by Vesta from public records. No ads, no pay-to-play.';

  hero.innerHTML =
    '<a class="crumb" href="/vesta">← Vesta</a>' +
    '<h1 class="page-h">' + esc(label) + ' Contractors in ' + COUNTY + ', CT</h1>' +
    '<p class="page-sub">The top ' + esc(tLower(trade)) + ' contractors across ' + COUNTY +
    ' — ranked by what homeowners actually say, weighted by how many said it, with a plain-English read of each. ' +
    'Connecticut registration and licensing are shown where they apply. No ads, no pay-to-play.</p>';

  // Read the public enrichment view directly (PostgREST, anon). The store is Fairfield-only
  // by construction, so trade + established-first ordering is the whole query.
  // Best-first: Bayesian homeowner-consensus score (volume-weighted rating), computed in
  // the view. Raw stars never leave the DB. Unrated rows -> null score -> the tail.
  const rows = await HOME.db('/profile_enrichment_public?trade=eq.' + encodeURIComponent(trade) +
    '&order=rank_score.desc.nullslast&limit=50' +
    '&select=place_id,name:business_name,city,registered,hic_issue_date,trade_license,certifications,synthesis');

  if (!Array.isArray(rows) || !rows.length){
    body.innerHTML = stripHtml(trade) +
      '<div class="card-block"><p class="note">We’re compiling ' + esc(tLower(trade)) + ' contractors in ' + COUNTY +
      ' right now — the verified public-record list goes live shortly. In the meantime you can ' +
      '<a href="/vesta/search" style="color:var(--vgreen-2)">search Vesta</a> for a pro near you.</p></div>' + disclosure();
    return;
  }

  body.innerHTML =
    stripHtml(trade) +
    '<h2 class="section-h">' + rows.length + ' ' + esc(tLower(trade)) + ' contractors</h2>' +
    '<p class="dir-count">Ranked by homeowner consensus · no ads, no pay-to-play</p>' +
    '<div class="grid" style="margin-top:1rem">' + rows.map(card).join('') + '</div>' +
    disclosure();

  function card(p){
    const href = '/c/' + encodeURIComponent(p.place_id);
    const chips = [];
    if (p.registered){
      const yr = p.hic_issue_date ? +String(p.hic_issue_date).slice(0,4) : 0;
      chips.push('<span class="badge">Registered CT contractor' + (yr && yr !== 1999 ? ' · since ' + yr : '') + ' ✓</span>');
    }
    if (Array.isArray(p.trade_license) && p.trade_license.length) chips.push('<span class="badge">Licensed ' + esc(tLower(trade)) + ' ✓</span>');
    if (Array.isArray(p.certifications)) for (const c of p.certifications){ if (c && c.issuer && c.level) chips.push('<span class="badge">' + esc(c.issuer + ' ' + c.level) + ' ✓</span>'); }
    const chipsHtml = chips.length ? '<div class="badges">' + chips.join('') + '</div>' : '';
    const syn = p.synthesis
      ? '<p class="card-syn"><span class="syn-lbl">What homeowners say</span>' + esc(p.synthesis) + '</p>'
      : '';
    return '<div class="card lift">' +
      '<a class="cardlink" href="' + href + '"><h3>' + esc(p.name) + '</h3></a>' +
      '<div class="sub">' + esc(p.city || COUNTY) + '</div>' +
      chipsHtml + syn +
      '<div class="spacer"></div>' +
      '<div><a class="pill pill-ghost pill-sm" href="' + href + '">View profile</a></div>' +
    '</div>';
  }

  function disclosure(){
    return '<p class="fine" style="margin-top:2rem;max-width:640px">Public-record compilation — not an endorsement. ' +
      'Compiled by Vesta from public records and publicly posted reviews; the "What homeowners say" summaries are ' +
      'written by Vesta, not the businesses. Any business can ' +
      '<a href="/terms.html#directory" style="color:var(--vgreen-2)">remove its listing or see how this works ›</a> at any time.</p>';
  }
});
</script>
</body>
</html>
