<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contractor Profile — Vesta</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png" type="image/png">
<meta name="theme-color" content="#f7f3ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional" rel="stylesheet">
<link rel="stylesheet" href="/home.css">
<script src="/home.js" defer></script>
</head>
<body>

<nav class="topnav">
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="square">
      <polyline points="94.5,5.5 5.5,5.5 5.5,94.5 70,94.5"/>
      <line x1="94.5" y1="5.5" x2="94.5" y2="70"/>
    </svg>
    4THWALL<span class="home-tag">VESTA</span>
  </a>
  <div class="nav-links">
    <a href="/vesta" class="nav-a">Find a pro</a>
    <a href="/address" class="nav-a">Check an address</a>
    <span id="nav-acct"><a class="nav-a" href="/signin">Sign in</a></span>
  </div>
</nav>

<main>
<section class="page-hero" id="hero">
  <div class="loading">Loading profile…</div>
</section>
<section class="section" id="body"></section>
</main>

<footer>
  <div class="foot-row">
    <span class="foot-brand">4th Wall Solutions · Stamford, CT</span>
    <div class="foot-links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
    </div>
  </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', async function(){
  const account = await HOME.navAccount();
  const esc = HOME.esc;
  const hero = document.getElementById('hero');
  const body = document.getElementById('body');

  const m = location.pathname.match(/^\/c\/([A-Za-z0-9_-]{8,200})\/?$/);
  const placeParam = (new URLSearchParams(location.search).get('place') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 200);
  const placeId = m ? m[1] : (placeParam.length >= 8 ? placeParam : null);
  if (!placeId){ hero.innerHTML = '<h1 class="page-h">Profile not found.</h1><p class="page-sub">Try <a href="/vesta" style="color:var(--orange)">searching again</a>.</p>'; return; }
  const zipParam = new URLSearchParams(location.search).get('zip') || '';
  const back = /^\d{5}$/.test(zipParam) ? '/vesta?zip=' + zipParam : '/vesta';

  const { data } = await HOME.api('/c/' + encodeURIComponent(placeId) + (/^\d{5}$/.test(zipParam) ? '?zip=' + zipParam : ''));
  if (!data.ok){
    hero.innerHTML = '<a class="crumb" href="' + back + '">← Back to results</a>' +
      '<h1 class="page-h">We couldn\'t load that profile.</h1><p class="page-sub">It may have moved — try <a href="/find" style="color:var(--orange)">searching again</a>.</p>';
    return;
  }
  const p = data.place, zip = data.zip;

  // Best-effort trade from the Places category (labels only — never invents data).
  const tradeGuess = (() => {
    const t = String(p.primary_type || '');
    if (/roof/i.test(t)) return 'roofing';
    if (/hvac|heating|air condition/i.test(t)) return 'hvac';
    if (/plumb/i.test(t)) return 'plumbing';
    if (/electric/i.test(t)) return 'electrical';
    if (/pav|asphalt|driveway|concrete/i.test(t)) return 'paving';
    if (/lawn|landscap/i.test(t)) return 'lawn_care';
    return '';
  })();
  const reqHref = '/vesta?mode=request&place=' + encodeURIComponent(placeId) +
    (zip ? '&zip=' + encodeURIComponent(zip) : '') + (tradeGuess ? '&trade=' + tradeGuess : '');

  hero.innerHTML = '<a class="crumb" href="' + back + '">← Back to results</a>' +
    '<h1 class="page-h">' + esc(p.name) + '</h1>' +
    '<p class="page-sub">' + (p.primary_type ? esc(p.primary_type) + ' · ' : '') + esc(p.address) + '</p>' +
    '<div class="badges"><span class="badge plain">Listed — not yet verified</span>' +
    (data.claimed ? '<span class="badge">Profile claimed</span>' : '') +
    (p.business_status === 'CLOSED_TEMPORARILY' ? '<span class="badge plain">Temporarily closed</span>' : '') +
    '</div>' +
    '<div style="margin:1rem 0 .2rem"><a class="pill pill-orange" href="' + reqHref + '">Request through Vesta <span class="arr">→</span></a></div>' +
    '<p class="fine">One form — Vesta carries your request to them, replies come straight to you.</p>' +
    '<p class="note">This pro isn\'t in the 4THWALL verified network, so there\'s no operational record to show — no measured response times, no verified job history. They may still be excellent; we just can\'t prove it. Here\'s everything the public record says, and exactly what it doesn\'t.</p>';

  const pubBlock = (() => {
    const rows = [];
    rows.push('<div class="kv"><span>Google rating</span><b>' +
      (p.rating != null && p.rating_count
        ? esc(p.rating) + '★ across ' + Number(p.rating_count).toLocaleString('en-US') + ' reviews'
        : 'None found') + '</b></div>');
    if (p.primary_type) rows.push('<div class="kv"><span>Listed category</span><b>' + esc(p.primary_type) + '</b></div>');
    rows.push('<div class="kv"><span>Business status</span><b>' +
      (p.business_status === 'CLOSED_TEMPORARILY' ? 'Temporarily closed' : 'Operational') + '</b></div>');
    return '<h2 class="section-h">The public record</h2><div class="card-block">' + rows.join('') +
      (p.maps_uri ? '<div style="margin-top:1rem"><a class="pill pill-ghost pill-sm" href="' + esc(p.maps_uri) + '" target="_blank" rel="noopener nofollow">See on Google Maps ↗</a></div>' : '') +
      '<p class="fine" style="margin-top:.8rem">Pulled live from Google the moment you opened this page — Vesta never stores it. Star ratings are marketing-grade signal: reviews can be begged, bought, and buried. Useful context, not proof.</p></div>';
  })();

  const proveBlock = '<h2 class="section-h">What nobody has proven</h2><div class="card-block">' +
    '<div class="kv"><span>Verified jobs on Vesta</span><b style="color:var(--dim)">—</b></div>' +
    '<div class="kv"><span>Measured response time</span><b style="color:var(--dim)">—</b></div>' +
    '<div class="kv"><span>Booking follow-through</span><b style="color:var(--dim)">—</b></div>' +
    '<div class="kv"><span>Documented work history</span><b style="color:var(--dim)">—</b></div>' +
    '<p class="note" style="margin-top:.8rem">A dash isn\'t an accusation — most pros have never been asked to prove their work this way. It means exactly what it says: nothing verified exists, so ask. The questions below are where to start.</p></div>';

  const verifyToolkit = (() => {
    const state = (p.address.match(/,\s*([A-Z]{2})\s+\d{5}/) || [])[1] || '';
    const bbb = 'https://www.bbb.org/search?find_text=' + encodeURIComponent(p.name) + (zip ? '&find_loc=' + encodeURIComponent(zip) : '');
    const lic = state === 'CT'
      ? 'Connecticut keeps a free registry — <a href="https://www.elicense.ct.gov/lookup/licenselookup.aspx" target="_blank" rel="noopener nofollow" style="color:var(--orange)">CT eLicense lookup ↗</a>. Home improvement contractors must be registered.'
      : 'Most states and counties keep a free registry — search “' + esc(state || 'your state') + ' home improvement contractor license lookup” and check the name matches exactly.';
    return '<h2 class="section-h">Verify it yourself — two minutes</h2><div class="card-block">' +
      '<ul style="margin:0 0 0 1.1rem;font-size:.88rem;line-height:1.8;color:var(--muted)">' +
      '<li><b style="color:var(--ink)">License:</b> ' + lic + '</li>' +
      '<li><b style="color:var(--ink)">Complaint history:</b> <a href="' + esc(bbb) + '" target="_blank" rel="noopener nofollow" style="color:var(--orange)">BBB lookup ↗</a> — what matters is less the grade than how they responded.</li>' +
      (p.maps_uri ? '<li><b style="color:var(--ink)">Every public review:</b> <a href="' + esc(p.maps_uri) + '" target="_blank" rel="noopener nofollow" style="color:var(--orange)">on Google Maps ↗</a> — read the 1-star ones first; patterns matter, one-offs don\'t.</li>' : '') +
      '<li><b style="color:var(--ink)">Insurance:</b> ask for a certificate of insurance — a real one comes directly from their agent, not as a photocopy.</li>' +
      '</ul></div>';
  })();

  const GUIDES = {
    roofing: ['A real quote separates tear-off vs. overlay — “roof over” is cheaper now and costs you at resale.', 'Materials should be named (shingle line, underlayment, ice &amp; water shield) — “architectural shingles” alone is not a spec.', 'Permits are the contractor\'s job to pull, not yours.', 'Two warranties exist: manufacturer (materials) and workmanship (labor). Get the labor one in writing with a number of years.'],
    hvac: ['A quote without a load calculation (Manual J or equivalent) is a guess — oversized units short-cycle and die early.', 'Ask whether the quote includes the line set, pad, electrical, and permit — these are the classic “that\'s extra” items.', 'SEER ratings matter less than correct sizing and a clean install.', 'Maintenance plans are fine, but the first year should be included.'],
    plumbing: ['Water heaters: the quote should say tank vs. tankless, capacity, and whether code upgrades (expansion tank, pan, venting) are included.', 'Permits are required for more than you\'d think — if they say “no permit needed” for a repipe, that\'s a flag.', 'Hourly vs. flat-rate is fine either way — what matters is which one it is, in writing.', 'Ask what happens to the quote if they open the wall and find more.'],
    electrical: ['Panel work and new circuits are permit work, full stop.', 'The quote should name the panel brand and amperage — “200A upgrade” without a brand is not a spec.', 'Ask if the price includes patching the drywall they open.', 'A licensed electrician\'s license number should appear on the contract.'],
    paving: ['Thickness is the spec: asphalt driveways live or die on base depth and compaction — get both numbers in writing.', '“Sealcoating included” usually means a quick spray — ask when, and what product.', 'Drainage is the difference between 5 years and 20 — the quote should say where water goes.', 'One-day “leftover asphalt” door-knock deals are the classic scam in this trade.'],
    lawn_care: ['Per-visit vs. seasonal contract — get which one it is, and what a “visit” includes, in writing.', 'Chemical applications should be itemized — what, when, and is it pet-safe.', 'Spring/fall cleanups are usually separate line items, not included.', 'Ask who actually shows up — owner crew or a sub.']
  };
  const guideBlock = tradeGuess && GUIDES[tradeGuess]
    ? '<h2 class="section-h">Know before you hire — ' + esc(HOME.tradeLabel(tradeGuess).toLowerCase()) + '</h2><div class="card-block">' +
      '<ul style="margin:0 0 0 1.1rem;font-size:.88rem;line-height:1.8;color:var(--muted)">' +
      GUIDES[tradeGuess].map(g => '<li>' + g + '</li>').join('') +
      '</ul><p class="fine" style="margin-top:.8rem">General guidance for this trade — not a claim about this business.</p></div>'
    : '';

  const checklist = '<h2 class="section-h">Before you hire — ask these</h2><div class="card-block">' +
    '<ul style="margin:0 0 0 1.1rem;font-size:.88rem;line-height:1.8;color:var(--muted)">' +
    '<li>Can you give me <b style="color:var(--ink)">three jobs like mine</b> from the past year I could drive past or call about?</li>' +
    '<li>Who actually does the work — <b style="color:var(--ink)">your crew, or a subcontractor</b>?</li>' +
    '<li>Are you <b style="color:var(--ink)">licensed and insured</b> for this trade in this town — and can I see the certificates?</li>' +
    '<li>What\'s the <b style="color:var(--ink)">written warranty</b>, and who honors it if the company changes hands?</li>' +
    '<li>If you open it up and find something worse, <b style="color:var(--ink)">what happens to the quote</b>?</li>' +
    '</ul><p class="fine" style="margin-top:.8rem">A good pro answers all five without flinching. Verified pros on Vesta answer the first one with a ledger.</p></div>';

  function contactRows(u){
    const rows = [];
    if (u.phone) rows.push('<div class="contactrow"><b>Phone</b><a href="tel:' + esc(String(u.phone).replace(/[^\d+]/g,'')) + '">' + esc(u.phone) + '</a></div>');
    if (u.website) rows.push('<div class="contactrow"><b>Website</b><a href="' + esc(u.website) + '" rel="nofollow noopener" target="_blank">' + esc(String(u.website).replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'')) + '</a></div>');
    for (const k in (u.socials || {})){
      rows.push('<div class="contactrow"><b>' + esc(HOME.tradeLabel(k)) + '</b><a href="' + esc(u.socials[k]) + '" rel="nofollow noopener" target="_blank">' + esc(String(u.socials[k]).replace(/^https?:\/\/(www\.)?/,'')) + '</a></div>');
    }
    return rows.length ? rows.join('') : '<p class="note">No public contact details surfaced for this pro — they may be phone-unlisted. Try the request flow instead.</p>';
  }

  function render(){
    let contactBlock;
    if (window.__unlocked){
      contactBlock = '<h2 class="section-h">Contact</h2><div class="card-block">' + contactRows(window.__unlocked) + '</div>';
    } else if (account){
      contactBlock = '<h2 class="section-h">Contact</h2><div class="card-block">' +
        '<p style="font-size:.9rem;margin-bottom:.8rem">Phone, website, and social profiles — everything public we can find.</p>' +
        '<button class="pill pill-orange" id="unlock-btn">Show contact info</button>' +
        '<span class="form-status" id="unlock-status"></span></div>';
    } else {
      contactBlock = '<h2 class="section-h">Contact</h2><div class="lockbox">' +
        '<div class="blur">(516) 555-0000 · example-website.com · facebook.com/example</div>' +
        '<p style="font-size:.9rem;margin-bottom:.9rem"><b>Contact info is free — it just needs an account.</b><br><span style="color:var(--muted);font-size:.82rem">One email, no password, ten seconds. Phone, website, socials — everything public we can find.</span></p>' +
        '<a class="pill pill-orange" href="' + HOME.signinHref() + '">Create free account / sign in</a></div>';
    }

    const claimBlock = data.claimed
      ? '<p class="note">✓ This profile has been claimed by the business.</p>'
      : '<h2 class="section-h">Is this your business?</h2><div class="card-block">' +
        '<p style="font-size:.9rem;margin-bottom:1rem">Claim this profile. Homeowners in your area are already looking — claiming takes a minute and costs nothing.</p>' +
        '<form id="claim-form">' +
        '<div class="form-row"><label class="form-label" for="cn">Your name *</label><input class="form-input" type="text" id="cn" name="name" required maxlength="80"></div>' +
        '<div class="form-row row-pair">' +
        '<div><label class="form-label" for="cp">Phone *</label><input class="form-input" type="tel" id="cp" name="phone" required maxlength="20"></div>' +
        '<div><label class="form-label" for="ce">Email</label><input class="form-input" type="email" id="ce" name="email" maxlength="120"></div></div>' +
        '<button class="pill pill-ghost" type="submit">Claim this profile</button>' +
        '<span class="form-status" id="claim-status"></span></form></div>';

    body.innerHTML = pubBlock + contactBlock + proveBlock + verifyToolkit + guideBlock + checklist + claimBlock +
      '<div class="card-block" style="margin-top:1.6rem">' +
      '<p style="font-size:.9rem"><b>Prefer a pro whose work is proven?</b> Verified pros carry ledger-backed badges and your job lands in your home\'s permanent record.</p>' +
      '<div style="margin-top:.8rem"><a class="pill pill-ghost pill-sm" href="/request">Request a verified pro <span class="arr">→</span></a></div></div>';

    const unlockBtn = document.getElementById('unlock-btn');
    if (unlockBtn) unlockBtn.addEventListener('click', async () => {
      unlockBtn.disabled = true;
      const st = document.getElementById('unlock-status');
      const { status, data: r } = await HOME.api('/c/' + encodeURIComponent(placeId) + '/unlock', { method:'POST', body:{ zip: zip || '' } });
      if (r.ok){ window.__unlocked = r.unlocked; render(); }
      else {
        unlockBtn.disabled = false;
        st.className = 'form-status is-error';
        st.textContent = status === 429 ? 'A lot of unlocks this hour — try again in a bit.' : 'Couldn\'t unlock — try again.';
      }
    });

    const claimForm = document.getElementById('claim-form');
    if (claimForm) claimForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const st = document.getElementById('claim-status');
      const btn = claimForm.querySelector('button');
      btn.disabled = true; st.className = 'form-status'; st.textContent = '…';
      const { data: r } = await HOME.api('/c/' + encodeURIComponent(placeId) + '/claim', {
        method:'POST',
        body:{ name: claimForm.name.value, phone: claimForm.phone.value, email: claimForm.email.value, zip: zip || '' }
      });
      if (r.ok){
        claimForm.outerHTML = '<p class="note">✓ Thanks, ' + esc(r.first_name) + ' — we have your claim on ' + esc(r.business) + '. We\'ll reach out to verify it\'s you, then the profile is yours.</p>';
      } else {
        btn.disabled = false;
        st.className = 'form-status is-error';
        st.textContent = r.error === 'missing_fields' ? 'Name + valid phone needed.' : r.error === 'rate_limited' ? 'Too many attempts — try later.' : 'Couldn\'t send — try again.';
      }
    });
  }

  window.__unlocked = data.unlocked || null;
  render();
});
</script>
</body>
</html>
