<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contractor Profile — Vesta</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png" type="image/png">
<meta name="theme-color" content="#0f1310">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional" rel="stylesheet">
<link rel="stylesheet" href="/home.css">
<script src="/home.js" defer></script>
</head>
<body class="v-dark">

<nav class="topnav">
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="square">
      <polyline points="94.5,5.5 5.5,5.5 5.5,94.5 70,94.5"/>
      <line x1="94.5" y1="5.5" x2="94.5" y2="70"/>
    </svg>
    4THWALL<span class="home-tag">VESTA</span>
  </a>
  <div class="nav-links">
    <a href="/vesta" class="nav-a">Find a pro</a>
    <a href="/address" class="nav-a">Check an address</a>
    <span id="nav-acct"><a class="nav-a" href="/signin">Sign in</a></span>
  </div>
</nav>

<main>
<section class="page-hero" id="hero">
  <div class="loading">Loading profile…</div>
</section>
<section class="section" id="body"></section>
</main>

<footer>
  <div class="foot-row">
    <span class="foot-brand">4th Wall Solutions · Stamford, CT</span>
    <div class="foot-links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
    </div>
  </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', async function(){
  const account = await HOME.navAccount();
  const esc = HOME.esc;
  const hero = document.getElementById('hero');
  const body = document.getElementById('body');

  const m = location.pathname.match(/^\/c\/([A-Za-z0-9_-]{8,200})\/?$/);
  const placeParam = (new URLSearchParams(location.search).get('place') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 200);
  const placeId = m ? m[1] : (placeParam.length >= 8 ? placeParam : null);
  if (!placeId){ hero.innerHTML = '<h1 class="page-h">Profile not found.</h1><p class="page-sub">Try <a href="/vesta" style="color:var(--vgreen-2)">searching again</a>.</p>'; return; }
  const zipParam = new URLSearchParams(location.search).get('zip') || '';
  const back = /^\d{5}$/.test(zipParam) ? '/vesta?zip=' + zipParam : '/vesta';

  const { data } = await HOME.api('/c/' + encodeURIComponent(placeId) + (/^\d{5}$/.test(zipParam) ? '?zip=' + zipParam : ''));
  if (!data.ok){
    hero.innerHTML = '<a class="crumb" href="' + back + '">← Back to results</a>' +
      '<h1 class="page-h">We couldn\'t load that profile.</h1><p class="page-sub">It may have moved — try <a href="/find" style="color:var(--vgreen-2)">searching again</a>.</p>';
    return;
  }
  const p = data.place, zip = data.zip;

  // Best-effort trade from the Places category (labels only — never invents data).
  const tradeGuess = (() => {
    const t = String(p.primary_type || '');
    if (/roof/i.test(t)) return 'roofing';
    if (/hvac|heating|air condition/i.test(t)) return 'hvac';
    if (/plumb/i.test(t)) return 'plumbing';
    if (/electric/i.test(t)) return 'electrical';
    if (/pav|asphalt|driveway|concrete/i.test(t)) return 'paving';
    if (/lawn|landscap/i.test(t)) return 'lawn_care';
    return '';
  })();
  const reqHref = '/vesta?mode=request&place=' + encodeURIComponent(placeId) +
    (zip ? '&zip=' + encodeURIComponent(zip) : '') + (tradeGuess ? '&trade=' + tradeGuess : '');

  // Vesta enrichment (public view; silent on absence — render nothing for null fields).
  const enrRows = await HOME.db('/profile_enrichment_public?place_id=eq.' + encodeURIComponent(placeId) +
    '&limit=1&select=registered,hic_issue_date,trade_license,certifications,synthesis,synthesis_review_count');
  const enr = Array.isArray(enrRows) && enrRows[0] ? enrRows[0] : null;

  hero.innerHTML = '<a class="crumb" href="' + back + '">← Back to results</a>' +
    '<h1 class="page-h">' + esc(p.name) + '</h1>' +
    '<p class="page-sub">' + (p.primary_type ? esc(p.primary_type) + ' · ' : '') + esc(p.address) + '</p>' +
    '<div class="badges"><span class="badge plain">Listed — not yet verified</span>' +
    (data.claimed ? '<span class="badge">Profile claimed</span>' : '') +
    (p.business_status === 'CLOSED_TEMPORARILY' ? '<span class="badge plain">Temporarily closed</span>' : '') +
    '</div>' +
    '<div style="margin:1rem 0 .2rem"><a class="pill pill-orange" href="' + reqHref + '">Request through Vesta <span class="arr">→</span></a></div>' +
    '<p class="fine">One form — Vesta carries your request to them, replies come straight to you.</p>' +
    '<p class="note">This business hasn\'t joined Vesta\'s verified network yet, so there\'s no verified work record to show — just the public listing below.</p>';

  const pubBlock = (() => {
    const rows = [];
    rows.push('<div class="kv"><span>Google rating</span><b>' +
      (p.rating != null && p.rating_count
        ? esc(p.rating) + '★ across ' + Number(p.rating_count).toLocaleString('en-US') + ' reviews'
        : 'None found') + '</b></div>');
    if (p.primary_type) rows.push('<div class="kv"><span>Listed category</span><b>' + esc(p.primary_type) + '</b></div>');
    rows.push('<div class="kv"><span>Business status</span><b>' +
      (p.business_status === 'CLOSED_TEMPORARILY' ? 'Temporarily closed' : 'Operational') + '</b></div>');
    return '<h2 class="section-h">The public record</h2><div class="card-block">' + rows.join('') +
      (p.maps_uri ? '<div style="margin-top:1rem"><a class="pill pill-ghost pill-sm" href="' + esc(p.maps_uri) + '" target="_blank" rel="noopener nofollow">See on Google Maps ↗</a></div>' : '') +
      '<p class="fine" style="margin-top:.8rem">Ratings, reviews, and category shown here are from Google, pulled live — Vesta never stores them. Star ratings are a marketing signal, not proof.</p></div>';
  })();

  function contactRows(u){
    const rows = [];
    if (u.phone) rows.push('<div class="contactrow"><b>Phone</b><a href="tel:' + esc(String(u.phone).replace(/[^\d+]/g,'')) + '">' + esc(u.phone) + '</a></div>');
    if (u.website) rows.push('<div class="contactrow"><b>Website</b><a href="' + esc(u.website) + '" rel="nofollow noopener" target="_blank">' + esc(String(u.website).replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'')) + '</a></div>');
    for (const k in (u.socials || {})){
      rows.push('<div class="contactrow"><b>' + esc(HOME.tradeLabel(k)) + '</b><a href="' + esc(u.socials[k]) + '" rel="nofollow noopener" target="_blank">' + esc(String(u.socials[k]).replace(/^https?:\/\/(www\.)?/,'')) + '</a></div>');
    }
    return rows.length ? rows.join('') : '<p class="note">No public contact details surfaced for this pro — they may be phone-unlisted. Try the request flow instead.</p>';
  }

  // Vouch chips (positive-only) + "What homeowners say" synthesis. Renders nothing if unenriched.
  function enrichBlock(){
    if (!enr) return '';
    const chips = [];
    if (enr.registered){
      const yr = enr.hic_issue_date ? +String(enr.hic_issue_date).slice(0,4) : 0;
      chips.push('<span class="badge">Registered CT contractor' + (yr && yr !== 1999 ? ' · since ' + yr : '') + ' ✓</span>');
    }
    if (Array.isArray(enr.trade_license) && enr.trade_license.length) chips.push('<span class="badge">Licensed ' + esc(tradeGuess || 'trade') + ' ✓</span>');
    if (Array.isArray(enr.certifications)) for (const c of enr.certifications){ if (c && c.issuer && c.level) chips.push('<span class="badge">' + esc(c.issuer + ' ' + c.level) + ' ✓</span>'); }
    const chipRow = chips.length ? '<div class="badges" style="margin:0 0 .5rem">' + chips.join('') + '</div>' +
      '<p class="fine" style="margin:0 0 1.3rem">Verified against public state and manufacturer directories · June 2026</p>' : '';
    const syn = enr.synthesis
      ? '<h2 class="section-h">What homeowners say</h2><div class="card-block">' +
        '<p style="font-size:.95rem;line-height:1.65">' + esc(enr.synthesis) + '</p>' +
        '<p class="fine" style="margin-top:.85rem">Summarized by Vesta from ' +
        (enr.synthesis_review_count ? esc(enr.synthesis_review_count) + ' ' : '') +
        'public reviews — not written by the business.</p></div>'
      : '';
    return chipRow + syn;
  }

  function render(){
    let contactBlock;
    if (window.__unlocked){
      contactBlock = '<h2 class="section-h">Contact</h2><div class="card-block">' + contactRows(window.__unlocked) + '</div>';
    } else if (account){
      contactBlock = '<h2 class="section-h">Contact</h2><div class="card-block">' +
        '<p style="font-size:.9rem;margin-bottom:.8rem">Phone, website, and social profiles — everything public we can find.</p>' +
        '<button class="pill pill-orange" id="unlock-btn">Show contact info</button>' +
        '<span class="form-status" id="unlock-status"></span></div>';
    } else {
      contactBlock = '<h2 class="section-h">Contact</h2><div class="lockbox">' +
        '<div class="blur">(516) 555-0000 · example-website.com · facebook.com/example</div>' +
        '<p style="font-size:.9rem;margin-bottom:.9rem"><b>Contact info is free — it just needs an account.</b><br><span style="color:var(--vmut);font-size:.82rem">One email, no password, ten seconds. Phone, website, socials — everything public we can find.</span></p>' +
        '<a class="pill pill-orange" href="' + HOME.signinHref() + '">Create free account / sign in</a></div>';
    }

    const claimBlock = data.claimed
      ? '<p class="note">✓ This profile has been claimed by the business.</p>'
      : '<h2 class="section-h">Is this your business?</h2><div class="card-block">' +
        '<p style="font-size:.9rem;margin-bottom:1rem">Claim this profile. Homeowners in your area are already looking — claiming takes a minute and costs nothing.</p>' +
        '<form id="claim-form">' +
        '<div class="form-row"><label class="form-label" for="cn">Your name *</label><input class="form-input" type="text" id="cn" name="name" required maxlength="80"></div>' +
        '<div class="form-row row-pair">' +
        '<div><label class="form-label" for="cp">Phone *</label><input class="form-input" type="tel" id="cp" name="phone" required maxlength="20"></div>' +
        '<div><label class="form-label" for="ce">Email</label><input class="form-input" type="email" id="ce" name="email" maxlength="120"></div></div>' +
        '<button class="pill pill-ghost" type="submit">Claim this profile</button>' +
        '<span class="form-status" id="claim-status"></span></form></div>';

    const removalNote = '<p class="fine" style="margin-top:1.2rem;max-width:560px">' +
      'This is a public-record listing compiled by Vesta — not an endorsement, and not written by the business. ' +
      'To remove or correct it, email <a href="mailto:andrew@4thwall.solutions?subject=Vesta%20listing%20removal" style="color:var(--vgreen-2)">andrew@4thwall.solutions</a> ' +
      '(<a href="/terms.html#directory" style="color:var(--vgreen-2)">how this works ›</a>).</p>';

    body.innerHTML = enrichBlock() + pubBlock + contactBlock + claimBlock + removalNote;

    const unlockBtn = document.getElementById('unlock-btn');
    if (unlockBtn) unlockBtn.addEventListener('click', async () => {
      unlockBtn.disabled = true;
      const st = document.getElementById('unlock-status');
      const { status, data: r } = await HOME.api('/c/' + encodeURIComponent(placeId) + '/unlock', { method:'POST', body:{ zip: zip || '' } });
      if (r.ok){ window.__unlocked = r.unlocked; render(); }
      else {
        unlockBtn.disabled = false;
        st.className = 'form-status is-error';
        st.textContent = status === 429 ? 'A lot of unlocks this hour — try again in a bit.' : 'Couldn\'t unlock — try again.';
      }
    });

    const claimForm = document.getElementById('claim-form');
    if (claimForm) claimForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const st = document.getElementById('claim-status');
      const btn = claimForm.querySelector('button');
      btn.disabled = true; st.className = 'form-status'; st.textContent = '…';
      const { data: r } = await HOME.api('/c/' + encodeURIComponent(placeId) + '/claim', {
        method:'POST',
        body:{ name: claimForm.name.value, phone: claimForm.phone.value, email: claimForm.email.value, zip: zip || '' }
      });
      if (r.ok){
        claimForm.outerHTML = '<p class="note">✓ Thanks, ' + esc(r.first_name) + ' — we have your claim on ' + esc(r.business) + '. We\'ll reach out to verify it\'s you, then the profile is yours.</p>';
      } else {
        btn.disabled = false;
        st.className = 'form-status is-error';
        st.textContent = r.error === 'missing_fields' ? 'Name + valid phone needed.' : r.error === 'rate_limited' ? 'Too many attempts — try later.' : 'Couldn\'t send — try again.';
      }
    });
  }

  window.__unlocked = data.unlocked || null;
  render();
});
</script>
</body>
</html>
