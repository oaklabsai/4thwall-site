function wireTopCard(con){
  const card = $('deck').querySelector('.card[data-k="0"]'); if(!card) return;
  const save = card.querySelector('.stamp-save'), pass = card.querySelector('.stamp-pass');
  const synEl = card.querySelector('.card-syn');
  let active=false, downX=0, downY=0, dx=0, dy=0, moved=0, t0=0, mode=null, startedInSyn=false, lastY=0, lastX=0, lastT=0, vx=0;
  const reset = anim => { card.style.transition = anim ? 'transform .3s cubic-bezier(.34,1.1,.64,1)' : 'none'; card.style.transform=''; if(save)save.style.opacity=0; if(pass)pass.style.opacity=0; };
  card.addEventListener('pointerdown', e => { active=true; downX=e.clientX; downY=e.clientY; lastY=e.clientY; lastX=e.clientX; lastT=Date.now(); vx=0; t0=Date.now(); moved=0; dx=0; dy=0; mode=null; startedInSyn = !!(synEl && synEl.contains(e.target) && synEl.scrollHeight > synEl.clientHeight + 2); card.style.transition='none'; try{card.setPointerCapture(e.pointerId);}catch(_){} });
  card.addEventListener('pointermove', e => {
    if(!active) return;
    dx=e.clientX-downX; dy=e.clientY-downY; moved=Math.max(moved, Math.abs(dx)+Math.abs(dy));
    // decide intent once: a vertical drag that began on the (scrollable) read scrolls it;
    // anything else swipes the card exactly as before — the core gesture is untouched.
    if(mode===null && moved>6){ mode = (startedInSyn && Math.abs(dy) > Math.abs(dx)) ? 'scroll' : 'swipe'; }
    if(mode==='scroll'){ if(synEl) synEl.scrollTop -= (e.clientY - lastY); lastY=e.clientY; return; }
    lastY=e.clientY;
    if(mode!=='swipe') return;
    // horizontal velocity (px/ms), lightly smoothed — lets a quick flick commit without
    // dragging the full distance, like every native card UI.
    const now=Date.now(), dt=now-lastT;
    if(dt>0){ vx = 0.75*vx + 0.25*((e.clientX-lastX)/dt); lastX=e.clientX; lastT=now; }
    card.style.transform='translate('+dx+'px,'+(dy*0.35)+'px) rotate('+(dx/20)+'deg)';
    if(save)save.style.opacity=Math.max(0,Math.min(1,dx/90));
    if(pass)pass.style.opacity=Math.max(0,Math.min(1,-dx/90));
  });
  const up = (e) => { if(!active) return; active=false; const dt=Date.now()-t0;
    if(moved<8 && dt<300){ reset(false);
      const tile = e && e.target && e.target.closest && e.target.closest('.vph-tile');
      if(tile){ const ph=PHOTO_CACHE.get(con.placeId)||[]; if(ph.length){ openPhotoLightbox(ph, +tile.dataset.i||0); return; } }
      const cover = e && e.target && e.target.closest && e.target.closest('.card-cover');
      if(cover){ fetchPhotos(con.placeId).then(ph => { if(ph && ph.length) openPhotoLightbox(ph, 0); }); return; }
      if(e && e.target && e.target.closest && e.target.closest('.vph')) return;   // tap in the gallery gutter — ignore
      tapCard(con); return;
    }
    if(mode==='scroll'){ return; }   // was reading the synthesis — don't swipe/commit
    // Commit on distance OR a decisive flick (fast, direction agrees, moved past the noise floor).
    const flick = Math.abs(vx) > 0.55 && Math.sign(vx) === Math.sign(dx) && Math.abs(dx) > 28;
    if(dx>90 || (flick && dx>0)){ commit('save', con); return; }
    if(dx<-90 || (flick && dx<0)){ commit('pass', con); return; }
    reset(true);
  };
  card.addEventListener('pointerup', up);
  card.addEventListener('pointercancel', () => { active=false; reset(true); });
  card.addEventListener('keydown', e => {
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tapCard(con); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); commit('save', con); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); commit('pass', con); }
  });
}
function tapCard(con){ if(desktop()){ logView(con&&con.placeId, con&&con.trade); renderPanel(con); } else openProfile(con.placeId); }
function commit(dir, con){
  const deck = $('deck'), card = deck.querySelector('.card[data-k="0"]');
  if(dir==='save') setLiked(con.placeId, true);
  if(card){ const off = dir==='save' ? 1 : -1; card.style.transition='transform .32s ease, opacity .32s ease'; card.style.transform='translate('+(off*480)+'px,-26px) rotate('+(off*20)+'deg)'; card.style.opacity='0'; }

  // flies out, so the deck visibly advances instead of snapping on the re-render. The
  // re-render then lands on identical resting positions — no visual seam.

/* Session history — every pro you swipe is remembered (most-recent first) so a
   pro you skipped isn't lost. Rewind undoes the last swipe in the current trade;

function pushHistory(con, dir){
  if(!con || !con.placeId) return;
  S.history = S.history.filter(h => h.placeId !== con.placeId);
  S.history.unshift({ placeId: con.placeId, trade: con.trade, dir });

/* ===== ANALYSIS (shared by panel + sheet) ===== */
function confidence(con){
  const n = con.reviewCount;
  if (n >= 60) return 'High';
  if (n >= 15) return 'Good';
  if (n > 0)   return 'Building';
  return con.registered ? 'Good' : 'Limited';
}
function confidenceNote(con){
  if (con.totalReviews > 0) return 'Grounded in this pro’s public homeowner reviews'+(con.registered?' and Connecticut contractor registration':'')+'.';
  return con.registered ? 'Grounded in this pro’s state registration and public records.' : 'Limited public review history so far — read with that in mind.';
}
function confidenceSignals(con){
  const out = [];
  if (con.standing) out.push(con.standing);
  if (con.totalReviews) out.push(con.totalReviews.toLocaleString('en-US')+' public homeowner review'+(con.totalReviews===1?'':'s'));
  if (con.registered) out.push('Registered CT contractor'+(con.sinceYear?' since '+con.sinceYear:''));
  con.certs.forEach(c => out.push(c+' — manufacturer-certified'));
  return out;
}
// TIER 2 — Vesta's analysis. The card (tier 1) carries the prose READ; the full
// profile (tier 3) is the standalone dossier. This middle tier is the EVIDENCE
// behind the verdict — what homeowners highlight + Vesta's confidence — never a
// second copy of the synthesis paragraph. Only a sparse profile (no structured
// highlights at all) falls back to the prose so the tier is never empty.
function evidenceHTML(con){
  const level = confidence(con), note = confidenceNote(con), signals = confidenceSignals(con);
  const highlights = con.knownFor.length
    ? '<div class="va-sec"><div class="va-lbl">What homeowners highlight</div><ul class="va-strengths">'+con.knownFor.map(k=>'<li>'+CHECK+'<span>'+esc(k)+'</span></li>').join('')+'</ul></div>'
    : (con.read ? '<div class="va-sec"><div class="va-lbl"><span class="va-dot"></span>Vesta’s read</div><p class="va-read">'+esc(con.read)+'</p></div>' : '');
  return highlights +
    '<div class="va-sec"><div class="va-lbl">Our confidence in this read</div>'+
      '<div class="va-conf"><div class="va-conf-l"><span class="va-shield">'+SHIELD+'</span>'+level+' confidence</div>'+
      '<div class="va-conf-n">'+esc(note)+'</div>'+
      (signals.length?'<ul class="va-checklist">'+signals.map(s=>'<li>'+CHECK+'<span>'+esc(s)+'</span></li>').join('')+'</ul>':'')+
      '</div></div>';
}
function analysisHTML(con){
  return ''+
    '<div class="va-head"><span class="va-spark">'+SPARK+'</span>Vesta’s analysis</div>'+
    '<h2 class="va-firm" style="view-transition-name:'+vtName(con.placeId)+'">'+esc(con.name)+'</h2>'+
    '<p class="va-town">'+esc(con.town)+' · '+esc(tradeLabelOf(con.trade))+'</p>'+

function feedTowns(){ const s=new Set(); byTrade(S.activeTrade).forEach(c=>{ const t=(c.city||'').trim(); if(t) s.add(t); }); return [...s].sort(); }
function facetMatches(c, f){ const specs=c.specs||[]; return f.m.some(kw => specs.some(s => s.includes(kw))); }
function activeFacets(){ return (NEED_FACETS[S.activeTrade]||[]).filter(f => S.feedNeeds.has(f.l)); }
// "Registered (HIC)" is only an honest filter where state registration is the norm — HIC-core trades
// (roofing/lawn/paving/painting/masonry run 29–70% registered). On licensed-exempt trades
// (plumbing/hvac/electrical, ~6–10%) HIC doesn't apply, so filtering by it would wrongly bury good
// firms — we hide the control there, and filterList ignores a stale flag, so it can never stick.
function tradeSupportsReg(trade){
  const rows = byTrade(trade); if (!rows.length) return false;
  const reg = rows.filter(c => c.registered).length;
  return reg >= 8 && reg >= 0.2 * rows.length;
}
function feedSource(){ return sortList(filterList(S.activeTrade), S.feedSort, false); }
// Light re-apply on town/sort/need change: re-render the feed list + needs + rail
// WITHOUT rebuilding the native <select>s — keeps them stable so a pick applies instantly.
function applyFeed(){
  const feed=$('feed'); if(!feed) return;
  if (S.feedTown && !feedTowns().includes(S.feedTown)) S.feedTown='';
  const list = feedSource();
  renderFeedNeeds();
  if (!list.length){ feed.innerHTML='<div class="feed-empty">No pros match those filters — try clearing one.</div>'; renderFeedRail(); syncSavedUI(); return; }
  feed.innerHTML = feedListHTML(list) + (S.match && S.match.job ? '' : silentTailHTML(S.activeTrade));
  list.forEach(wireFeedCard);
  wireSilentTail();
  lazyCovers(feed);
  renderFeedRail(); syncSavedUI();
}

// The desktop rail is "the field at a glance" — real per-trade analytics computed from
// the loaded data, never fabricated. The honesty lines it holds: band SHARES not ordinal
// ranks (top10/top25 is the true resolution of rank_score — a #1..#N list would over-claim);
// aggregates describe the market, never grade an individual firm downward; every number is
// recomputable from what's on the page; the registered share renders only where registration
// is the norm (same tradeSupportsReg gate as the filter). No deltas, no activity counters —
// we have no time-series, so we show fractions ("12 of 40 do this") instead of trends.
let _railTrade = null;
function renderFeedRail(){
  const p=$('vpanel'); if(!p) return;
  const key = S.activeTrade, base = byTrade(key);
  if (!base.length){ p.innerHTML=''; return; }
  const silent = silentByTrade(key).length, onRecord = base.length + silent;
  const t10 = base.filter(c=>c.ratingBand==='top10').length;
  const t25 = base.filter(c=>c.ratingBand==='top25').length;
  const rest = base.length - t10 - t25;
  const reviewsRead = base.reduce((s,c)=>s+(c.reviewCount||0),0);
  const tenures = base.map(c=>c.sinceYear).filter(y=>y>0).map(y=>2026-y).sort((a,b)=>a-b);
  const medTen = tenures.length >= 5 ? tenures[Math.floor(tenures.length/2)] : 0;
  const regN = base.filter(c=>c.registered).length;
  const facets = (NEED_FACETS[key]||[])
    .map(f=>({ f, n: base.filter(c=>facetMatches(c,f)).length }))
    .filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,5);
  const seg = (n,cls)=> n>0 ? '<span class="fr2-seg '+cls+'" style="flex:'+n+'"></span>' : '';
  const facts = [];
  if (reviewsRead) facts.push('<b>'+reviewsRead.toLocaleString('en-US')+'</b> reviews read');
  if (medTen) facts.push('<b>'+medTen+'</b> yrs median tenure');
  if (tradeSupportsReg(key) && base.length) facts.push('<b>'+Math.round(100*regN/base.length)+'%</b> state-registered');
  p.innerHTML =
    '<div class="va-head"><span class="va-spark">'+SPARK+'</span>The field at a glance</div>'+
    '<div class="fr2-hero"><span class="fr2-n" id="fr2-n">'+base.length+'</span>'+
      '<span class="fr2-hl">vetted '+esc(tradePlural(key))+'<br><span class="fr2-sub">of '+onRecord+' on public record in Fairfield County</span></span></div>'+
    '<div class="fr2-bar" role="img" aria-label="Standing distribution: '+t10+' top 10%, '+t25+' top 25%, '+rest+' established base">'+

// Honest, collapsed "N more, not yet reviewed" section. Count-only firms: what's on
// public record (registered since X · N reviews) + a "Not yet reviewed" tag, linking to /c/.
function silentCardHTML(con){
  const bits = [];
  if (con.registered) bits.push(con.sinceYear ? 'Registered since ' + con.sinceYear : 'State-registered');
  if (con.totalReviews) bits.push(con.totalReviews + ' review' + (con.totalReviews === 1 ? '' : 's') + ' on record');
  const meta = bits.length ? '<span class="sc-meta">' + esc(bits.join(' · ')) + '</span>' : '';
  return '<a class="silent-card" href="/c/' + encodeURIComponent(con.placeId) + '">' +
    '<span class="sc-main"><span class="sc-name">' + esc(con.name) + '</span>' +
    '<span class="sc-town">' + esc(con.town) + '</span>' + meta + '</span>' +
    '<span class="sc-tag">Not yet reviewed</span></a>';
}
function silentTailHTML(trade){
  const list = silentByTrade(trade);
  if (!list.length) return '';
  return '<div class="silent-tail"><button class="silent-toggle" id="silent-toggle" type="button" aria-expanded="false" aria-controls="silent-list">' +
    '<span><b>' + list.length + '</b> more ' + esc(tradePlural(trade)) + ' in Fairfield County we haven’t published a read on yet</span>' +
    '<span class="st-chev" aria-hidden="true"></span></button>' +
    '<div class="silent-list" id="silent-list" hidden>' +
      '<p class="st-note">Vesta hasn’t reviewed these yet — no read, no ranking. They’re here for completeness so you see the whole field; below is only what’s on public record.</p>' +
      list.map(silentCardHTML).join('') + '</div></div>';
}
function wireSilentTail(){
  const t = $('silent-toggle'); if (!t) return;
  t.addEventListener('click', () => {
    const l = $('silent-list'); const open = t.getAttribute('aria-expanded') === 'true';
    t.setAttribute('aria-expanded', open ? 'false' : 'true'); t.classList.toggle('open', !open);
    if (l) l.hidden = open;
  });
}
function renderFeed(){
  const feed=$('feed'); if(!feed) return;
  if (S.feedTown && !feedTowns().includes(S.feedTown)) S.feedTown='';
  renderFeedEntry();
  renderFeedControls();
  const list = feedSource();
  renderFeedNeeds();
  if (!S.dataLoaded){ feed.innerHTML='<div class="feed-empty">Loading vetted pros…</div>'; renderFeedRail(); return; }
  if (!list.length){ feed.innerHTML='<div class="feed-empty">No pros match those filters — try clearing one.</div>'; renderFeedRail(); syncSavedUI(); return; }
  feed.innerHTML = feedListHTML(list) + (S.match && S.match.job ? '' : silentTailHTML(S.activeTrade));
  list.forEach(wireFeedCard);
  wireSilentTail();
  lazyCovers(feed);
  renderFeedRail(); syncSavedUI();
}
function focusFeedCard(placeId){
  const card=[...document.querySelectorAll('#feed .fcard')].find(el=>el.dataset.place===placeId); if(!card) return;
  card.scrollIntoView({behavior:'smooth', block:'center'});
  const disc=card.querySelector('.fcard-disclose'), more=card.querySelector('.fcard-more');
  if(more && !more.classList.contains('open')){ more.classList.add('open'); if(disc) disc.setAttribute('aria-expanded','true'); }
  card.classList.add('flash'); setTimeout(()=>card.classList.remove('flash'),1500);
}

function initSheetDrag(){
  const handle = $('phandle'), sheet = $('psheet'); let on=false, y0=0, y=0;
  handle.addEventListener('pointerdown', e => { if(desktop()) return; if(e.target.closest('.psheet-x')) return; on=true; y0=y=e.clientY; handle.setPointerCapture(e.pointerId); sheet.style.transition='none'; });
  handle.addEventListener('pointermove', e => { if(!on) return; y=e.clientY; sheet.style.transform='translateX(-50%) translateY('+Math.max(0,y-y0)+'px)'; });
  handle.addEventListener('pointerup', () => { if(!on) return; on=false; const dy=y-y0;
    if(dy>80){ sheet.style.transition='transform .3s ease'; sheet.style.transform='translateX(-50%) translateY(110%)'; $('pscrim').classList.remove('open'); S.sheetOpen=false; setTimeout(()=>{sheet.style.transform='';sheet.style.transition='';sheet.classList.remove('open');},300); }
    else { sheet.style.transition='transform .3s cubic-bezier(.34,1.1,.64,1)'; sheet.style.transform='translateX(-50%) translateY(0)'; setTimeout(()=>{sheet.style.transform='';sheet.style.transition='';},300); }
  });
  handle.addEventListener('pointercancel', () => { on=false; sheet.style.transform=''; sheet.style.transition=''; });
}

/* SEARCH */
function openSearch(){ const o=$('vsearch'); o.classList.add('open'); o.setAttribute('aria-hidden','false'); const inp=$('vsearch-input'); inp.value=''; renderSearchResults(''); S.searchOpen=true; setTimeout(()=>inp.focus(),60); }
function closeSearch(){ $('vsearch').classList.remove('open'); $('vsearch').setAttribute('aria-hidden','true'); S.searchOpen=false; }
function renderSearchResults(q){
  q = (q||'').trim().toLowerCase(); const res = $('vsearch-results');
  if(!q){
    // Empty state was a dead instructional sentence — give it something to tap instead,
    // 6 real examples (same pool as the home typewriter) reshuffled each time it opens.
    const picks = shuffle([...SEARCH_EG]).slice(0,6);
    res.innerHTML = '<p class="vsearch-hint">Search by name, town, or what you need — or try one:</p>'+
      '<div class="vsearch-sugg">'+picks.map(p=>'<button class="chip" data-fill="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>';
    res.querySelectorAll('[data-fill]').forEach(b=>b.addEventListener('click', ()=>{
      const v=b.dataset.fill; const inp=$('vsearch-input'); if(inp) inp.value=v; renderSearchResults(v);
    }));
    return;
  }
  // problem→job first (the match flow with the need preselected), problem→trade as the fallback —
  // the typed need enters the match instead of dying at generic browse.
  const seed = routeJobSeed(q);
  const routed = seed ? seed.trade : routeProblem(q);
  const sug = seed ? '<button class="vsr vsr-route" data-route="'+esc(seed.trade)+'" data-job="'+esc(seed.job)+'">'+
      '<span class="vsr-mono" aria-hidden="true">'+ICONS[tradeIconOf(seed.trade)]+'</span>'+
      '<span class="vsr-main"><span class="vsr-name">'+esc(jobLabel(seed.job))+'</span><span class="vsr-town">Vesta Match &middot; tailored '+esc(tradePlural(seed.trade))+'</span></span>'+
      '<span class="vsr-arrow" aria-hidden="true">&rarr;</span>'+
    '</button>'
  : routed ? '<button class="vsr vsr-route" data-route="'+esc(routed)+'">'+
      '<span class="vsr-mono" aria-hidden="true">'+ICONS[tradeIconOf(routed)]+'</span>'+
      '<span class="vsr-main"><span class="vsr-name">Browse '+esc(tradePlural(routed))+'</span><span class="vsr-town">Vesta-ranked '+esc(tradeLabelOf(routed))+' in Fairfield County</span></span>'+
      '<span class="vsr-arrow" aria-hidden="true">&rarr;</span>'+
    '</button>' : '';
  // Match name + town + trade label + specialties/known-for (c.specs is pre-lowercased) — so a
  // specific-need query ("skylights", "EV charger", "retaining wall", "excavation") finds the pros
  // who actually do it, not just name/town hits. (Synthesis prose is left out — too noisy to match on.)
  const matches = contractors.filter(c =>
    c.name.toLowerCase().includes(q) ||
    c.town.toLowerCase().includes(q) ||
    (tradeLabelOf(c.trade) || '').toLowerCase().includes(q) ||
    (c.specs || []).some(s => s.includes(q))
  ).slice(0,40);
  if(!sug && !matches.length){ res.innerHTML = '<p class="vsearch-hint">No matches yet — try a trade like &ldquo;roofing&rdquo; or a town.</p>'; return; }
  res.innerHTML = sug + matches.map(c =>
    '<button class="vsr" data-place="'+esc(c.placeId)+'" data-trade="'+esc(c.trade)+'">'+
      '<span class="vsr-mono" aria-hidden="true">'+esc(monogram(c.name))+'</span>'+
      '<span class="vsr-main"><span class="vsr-name">'+esc(c.name)+'</span><span class="vsr-town">'+esc(c.town)+' · '+esc(tradeLabelOf(c.trade))+'</span></span>'+
    '</button>').join('');
  const rt = res.querySelector('.vsr-route'); if(rt) rt.addEventListener('click', () => {
    closeSearch();
    if (rt.dataset.job) enterMatch(rt.dataset.route, { job:rt.dataset.job });                  // need preselected — straight past Q1
    else openBrowse(rt.dataset.route, { hi:queryHi(q), hiLabel:q.slice(0,28) });               // trade only — the words still pre-highlight Q1
  });
  Array.from(res.querySelectorAll('.vsr:not(.vsr-route)')).forEach(b => b.addEventListener('click', () => goToPro(b.dataset.trade, b.dataset.place)));
}
function goToPro(tradeKey, placeId){
  closeSearch();
  if (tradeKey !== S.activeTrade) S.match = null;   // a match belongs to its trade — never leaks onto another trade's deck or form
  S.mode = 'trade'; S.activeTrade = tradeKey;
  if (S.screen !== 'browse') showScreen('browse');
  renderNeedChips(); renderSidebar(); updateNavState();
  if (desktop()){
    const c = contractors.find(x => x.placeId === placeId);
    if (c && S.feedTown && (c.city||'') !== S.feedTown) S.feedTown = '';   // clear filter so the target is visible
    S.feedNeeds = new Set();   // clear need-filters so the target pro is never filtered out
    FEED_HIDDEN.delete(placeId);
    showDeck(); updateBrowseHead(); renderFeed();
    requestAnimationFrame(() => focusFeedCard(placeId));
    return;
  }
  ensureDeck(tradeKey);
  const arr = S.shuffles[tradeKey] || []; const pos = S.pos[tradeKey] || 0;
  const gi = arr.findIndex(c => c.placeId === placeId);
  if (gi >= 0 && gi !== pos){ const [card] = arr.splice(gi,1); arr.splice(pos,0,card); }
  S.deckIdx = pos;
  showDeck(); updateBrowseHead(); renderDeck();
  const con = topCon();
  if (con) openSheet(con);
}

function tradeGuessFrom(t){
  t = String(t||'');
  if (/roof/i.test(t)) return 'roofing';
  if (/hvac|heating|air condition/i.test(t)) return 'hvac';
  if (/plumb/i.test(t)) return 'plumbing';
  if (/electric/i.test(t)) return 'electrical';
  if (/pav|asphalt|driveway|concrete/i.test(t)) return 'paving';
  if (/tree|arborist|stump/i.test(t)) return 'tree_service';
  if (/floor|hardwood|carpet|laminate|vinyl/i.test(t)) return 'flooring';
  if (/lawn|landscap/i.test(t)) return 'lawn_care';
  if (/paint/i.test(t)) return 'painting';
  if (/mason|brick|stone|chimney/i.test(t)) return 'masonry';
  if (/window|garage.{0,8}door|glazier|egress/i.test(t)) return 'windows_doors';
  if (/\bpool\b|hot tub|\bspa\b/i.test(t)) return 'pool';
  return '';
}

async function openProfile(placeId){
  if (!placeId) return;
  logView(placeId, S.activeTrade);
  S.profFrom = { screen:S.screen, mode:S.mode, trade:S.activeTrade };
  closeSheet(); closeSearch(); if (S.filterOpen) closeFilterSheet(); closeFeedMenus();
  showScreen('profile'); updateNavState();
  const sc=$('prof-scroll'); if(sc) sc.scrollTop=0;
  window.scrollTo(0,0);   // desktop scrolls the document, not prof-scroll — without this the profile opens blank at the deck's old offset
  $('prof-wrap').innerHTML = '<button class="prof-crumb" id="prof-back">'+BACKARROW+'<span>Back</span></button><div class="prof-loading">Loading profile…</div>';
  wireProfBack();
  try {
    const resp = await HOME.api('/c/'+encodeURIComponent(placeId));
    const data = resp && resp.data;
    if (!data || !data.ok){ $('prof-wrap').innerHTML = profErrorHTML(); wireProfBack(); return; }
    const enrRows = await HOME.db('/profile_enrichment_public?place_id=eq.'+encodeURIComponent(placeId)+
      '&limit=1&select=trade,registered,hic_issue_date,trade_license,certifications,synthesis,synthesis_review_count,'+
      'signature,known_for,specialties,service_area,owner_name,volume_band,rating_band,tenure_band,trade_n,'+
      'capabilities,value_tier,deep_review_count,rating_count');
    const enr = Array.isArray(enrRows) && enrRows[0] ? enrRows[0] : null;
    profData = { placeId, p:data.place, enr, claimed:!!data.claimed, unlocked:data.unlocked||null };
    renderProfile();
  } catch(_){
    $('prof-wrap').innerHTML = profErrorHTML(); wireProfBack();
  }
}

function profStandingHTML(){
  const enr=profData.enr; if (!enr) return '';
  const trade=pTradeKey();
  const firms = PTRADE_FIRMS[trade] || 'pros';
  const tLower = trade==='hvac' ? 'HVAC' : ((PTRADE_LABEL[trade]||'').toLowerCase());
  const caps = (enr.capabilities && typeof enr.capabilities==='object') ? enr.capabilities : {};
  const reviewN = Number(enr.deep_review_count || enr.rating_count || 0);
  const nStr = reviewN ? reviewN.toLocaleString('en-US') : '';
  const items=[];   // [kicker, title, desc] — built strongest-first, capped at 4
  // 1) Scarce specialties — the sharpest differentiator, lead with them.
  const specMap = STANDING_SPECIALTY[trade] || {};
  for (const key in specMap){ if (caps[key]){ const s=specMap[key]; items.push([s[0], s[1], s[2].replace(/%F/g, firms)]); } }
  // 2) Tenure.
  if (enr.tenure_band==='top25'){ const yr=enr.hic_issue_date?+String(enr.hic_issue_date).slice(0,4):0; items.push(['Tenure','Long-established','Registered with the state'+(yr&&yr!==1999?' since '+yr:'')+' — one of the longer-established '+firms+' we track in Fairfield County.']); }
  // 3) Review volume — quantified (COUNT yes).
  if (enr.volume_band==='top10') items.push(['Review volume','Among the most-reviewed',(nStr?nStr+' homeowner reviews on record — one':'One')+' of the most-reviewed '+firms+' in Fairfield County.']);
  else if (enr.volume_band==='top25') items.push(['Review volume','A deep track record',(nStr?nStr+' homeowner reviews — a':'A')+' deeper bank of homeowner reviews than most '+firms+' we track.']);
  // 4) Rating BAND only — never the score.
  if (enr.rating_band==='top10') items.push(['Homeowner rating','Top-rated at scale','Holds a top-tier homeowner rating'+(nStr?' across all '+nStr+' reviews':'')+' — consistency at a volume most firms never reach.']);
  else if (enr.rating_band==='top25') items.push(['Homeowner rating','Strongly rated','Carries one of the stronger homeowner ratings among the '+firms+' we track, across a meaningful number of reviews.']);
  if (!items.length) return '';
  const cards = items.slice(0,4).map(it=>'<div class="prof-card"><div class="k">'+esc(it[0])+'</div><h3>'+it[1]+'</h3><p>'+esc(it[2])+'</p></div>').join('');
  return '<h2 class="prof-sec-h">Where it stands</h2>'+
    '<p class="prof-sec-note">What sets them apart on the signals Vesta can verify — public records, manufacturer credentials, and a deep read of review history, not a paid placement.</p>'+

}

let reqData = null;
function enterRequest(ctx){
  if (!ctx || !ctx.placeId) return;
  logRequest(ctx.placeId, ctx.trade);
  S.reqFrom = { screen:S.screen };
  closeSheet(); closeSearch(); if (S.filterOpen) closeFilterSheet(); closeFeedMenus();
  // Carry the declared need into the form + intro email — only when the pro's trade is the one
  // the match was run on (a saved pro from another trade gets a clean form).
  const carry = (S.match && S.match.job && ctx.trade === S.activeTrade) ? { job:S.match.job } : null;
  reqData = { placeId:ctx.placeId, trade:ctx.trade||'', name:ctx.name||'', match:carry };
  showScreen('request'); updateNavState();
  const sc=$('req-scroll'); if(sc) sc.scrollTop=0;
  window.scrollTo(0,0);   // same document-scroll reset as openProfile
  $('req-wrap').innerHTML = requestHTML();
  wireRequest();
}
function requestHTML(){

  const tl = reqData.trade ? esc(tradeLabelOf(reqData.trade)) : '';

        '<div><label class="req-label" for="rq-urg">How soon</label><select class="req-select" id="rq-urg">'+

function wireRequest(){
  const b=$('req-back'); if(b) b.addEventListener('click', backFromRequest);
  const f=$('req-form'); if(f) f.addEventListener('submit', requestSubmit);
}
function backFromRequest(){
  const f = S.reqFrom || {};
  if (f.screen==='profile'){ showScreen('profile'); updateNavState(); return; }
  if (f.screen==='browse'){ showScreen('browse'); updateNavState(); return; }
  openBrowse(S.activeTrade || 'roofing');
}
async function requestSubmit(e){
  e.preventDefault();
  const st=$('rq-status'), out=$('req-result'), btn=e.target.querySelector('button[type=submit]');
  const fail=(m)=>{ st.className='prof-status is-error'; st.textContent=m; btn.disabled=false; };
  const summary=(($('rq-sum')||{}).value||'').trim().slice(0,500);
  const name=(($('rq-name')||{}).value||'').trim().slice(0,80);
  const email=(($('rq-email')||{}).value||'').trim();
  const zip=(($('rq-zip')||{}).value||'').replace(/[^\d]/g,'').slice(0,5);
  const urgency=($('rq-urg')||{}).value||'soon';
  if (!summary) return fail('Say what’s going on first.');
  if (!/.+@.+\..+/.test(email)) return fail('Add an email — replies land there.');
  btn.disabled=true; st.className='prof-status'; st.textContent='Sending…';
  const trade = TRADE_DB[reqData.trade] || reqData.trade || '';
  const who = esc(reqData.name||'this pro');
  try {
    const { data:r } = await HOME.api('/request', { method:'POST', body:{ trade, zip, summary, urgency, name, email, place_ids:[reqData.placeId] } });
    if (r && r.ok){
      const t = (r.targets||[])[0] || {};
      let msg;
      if (t.emailed) msg = '<b style="color:var(--olive)">'+who+'</b> just received your request — a reply will come to <b style="color:var(--olive)">'+esc(email)+'</b>.';
      else if (!r.email_configured) msg = 'Your request to <b style="color:var(--olive)">'+who+'</b> is in — direct delivery is coming online, and we’ll route it to them the moment it does.';
      else msg = 'We couldn’t find a public inbox for <b style="color:var(--olive)">'+who+'</b> yet — your request is saved, and we’ll relay it as soon as we can reach them.';
      $('req-form').hidden = true;
      out.innerHTML = '<h2 class="prof-sec-h">Request on its way ✓</h2>'+
        '<div class="prof-block"><p style="font-size:15px;line-height:1.6;color:var(--olive)">'+msg+'</p>'+
        '<p class="prof-fine" style="margin-top:12px">Whoever answers, you talk to them directly — Vesta steps out of the conversation.</p>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button type="button" class="de-btn ghost" id="rq-back2">Done</button></div></div>';
      const bb=$('rq-back2'); if(bb) bb.addEventListener('click', backFromRequest);
      const sc=$('req-scroll'); if(sc) sc.scrollTop=0;
      window.scrollTo(0,0);
    } else {
      fail(r && r.error==='rate_limited' ? 'Daily send limit reached — try again tomorrow.' : 'Couldn’t send — try again.');
    }
  } catch(_){ fail('Couldn’t send — try again.'); }
}

/* ===== MATCH WALKTHROUGH UI (Q1 the job → Q2 what matters) ===== */
const MW_ARROW = '<svg class="mw-opt-ic" width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5L12 9l-5.5 5.5"/></svg>';
const MW_TOP = 9;          // jobs shown before the "More options" expander (high-cardinality trades)
let _mwMoreOpen = false;
let _pendingJob = null;    // the Q1 choice, held while Q2 is answered

// A trade opens the triage only if it has a real question bank (loaded from vesta_match_options).
function tradeMatchable(appTrade){ const b=tradeBank(appTrade); return !!(b && b.jobs && b.jobs.length); }

// User picked a trade/problem → run the triage. A seeded job (a specific problem pill) skips Q1.
function enterMatch(key, opts){
  opts = opts || {};
  S.mode='trade'; S.activeTrade=key; S.feedTown=''; S.feedNeeds=new Set(); S.feedSort='rank';
  S.match=null; S.matchPending=true; S.matchStep='job'; _mwMoreOpen=false; _pendingJob=null;
  S.matchHi = opts.hi || null; S.matchHiLabel = opts.hiLabel || null;   // seeded need → Q1 pre-highlight
  renderNeedChips(); renderSidebar(); showScreen('match'); updateNavState();
  if (opts.job) pickJob(opts.job); else renderMatchWalk();
}
function renderMatchWalk(){
  const wrap = $('match-wrap'); if(!wrap) return;
  if (S.matchStep==='priority'){ wrap.innerHTML = matchWalkPriorityHTML(); wireMatchPriority(); }
  else { wrap.innerHTML = matchWalkJobHTML(); wireMatchJob(); }
  wrap.scrollTop = 0;
}
function matchWalkJobHTML(){
  const b = tradeBank(S.activeTrade); let jobs = (b&&b.jobs)?b.jobs.slice():[];
  // A seeded need (home chip / typed search) pins its closest jobs to the top, tagged — the chip
  // pre-answers Q1 without skipping the homeowner's confirmation. Cap 3; bank order breaks ties.
  let hits = new Set();
  if (S.matchHi && S.matchHi.length){
    const hit = j => S.matchHi.some(k => j.value.indexOf(k.replace(/ /g,'-'))!==-1 || j.label.toLowerCase().indexOf(k)!==-1);
    const top = jobs.filter(hit).slice(0,3);
    if (top.length){ hits = new Set(top.map(j=>j.value)); jobs = top.concat(jobs.filter(j=>!hits.has(j.value))); }
  }
  const hiTag = '<span class="mw-hit-tag">Closest to '+(S.matchHiLabel ? '&ldquo;'+esc(S.matchHiLabel)+'&rdquo;' : 'your pick')+'</span>';
  const shown = _mwMoreOpen ? jobs : jobs.slice(0, MW_TOP);
  const hasMore = jobs.length > shown.length;
  const opt = j => '<button class="mw-opt'+(hits.has(j.value)?' mw-opt--hit':'')+'" data-job="'+esc(j.value)+'"><span class="mw-opt-l"><span class="mw-opt-name">'+esc(j.label)+'</span>'+(hits.has(j.value)?hiTag:'')+'</span>'+MW_ARROW+'</button>';
  return '<div class="mw-inner">'+
    '<div class="mw-kicker">'+SPARK+'Vesta Match<span class="mw-step"> · Step 1 of 2</span></div>'+
    '<h1 class="mw-q">What do you need done?</h1>'+
    '<p class="mw-hint">Pick the closest — Vesta tailors its '+esc(tradePlural(S.activeTrade))+' to it.</p>'+
    '<div class="mw-opts">'+shown.map(opt).join('')+'</div>'+
    (hasMore ? '<button class="mw-more" id="mw-more">More options</button>' : '')+
    '<div class="mw-foot"><button class="mw-skip" id="mw-skip">Not sure — just show me the best</button></div>'+
  '</div>';
}
function wireMatchJob(){
  const wrap=$('match-wrap'); if(!wrap) return;
  wrap.querySelectorAll('.mw-opt').forEach(b=> b.addEventListener('click', ()=> pickJob(b.dataset.job)));
  const more=$('mw-more'); if(more) more.addEventListener('click', ()=>{ _mwMoreOpen=true; renderMatchWalk(); });
  const skip=$('mw-skip'); if(skip) skip.addEventListener('click', skipMatch);
}
function matchWalkPriorityHTML(){
  const b = tradeBank(S.activeTrade), axes = (b&&b.axes)?b.axes:[];
  const jl = jobLabel(_pendingJob);
  const opt = a => '<button class="mw-opt" data-axis="'+esc(a.axis)+'"><span class="mw-opt-l"><span class="mw-opt-name">'+esc(a.label)+'</span><span class="mw-opt-blurb">'+esc(a.blurb)+'</span></span>'+MW_ARROW+'</button>';
  const none = '<button class="mw-opt mw-opt--wide" data-axis=""><span class="mw-opt-l"><span class="mw-opt-name">No preference</span><span class="mw-opt-blurb">Just show me the best for this job</span></span>'+MW_ARROW+'</button>';
  return '<div class="mw-inner">'+
    '<div class="mw-kicker">'+SPARK+'Vesta Match<span class="mw-step"> · Step 2 of 2</span></div>'+
    '<h1 class="mw-q">For '+esc(lc(jl))+' — what matters most?</h1>'+
    '<p class="mw-hint">Optional. This only re-orders the picks; the job always comes first.</p>'+
    '<div class="mw-opts">'+axes.map(opt).join('')+none+'</div>'+
    '<div class="mw-foot"><button class="mw-backbtn" id="mw-back2"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5L5 9L11 14.5"/></svg>Back</button></div>'+
  '</div>';
}
function wireMatchPriority(){
  const wrap=$('match-wrap'); if(!wrap) return;
  wrap.querySelectorAll('.mw-opt').forEach(b=> b.addEventListener('click', ()=> applyMatch(_pendingJob, b.dataset.axis||null)));
  const back=$('mw-back2'); if(back) back.addEventListener('click', ()=>{ S.matchStep='job'; renderMatchWalk(); });
}
function pickJob(jobValue){
  _pendingJob = jobValue;
  const b = tradeBank(S.activeTrade);
  // Situation routing: a declared emergency answers Q2 itself — the generic "what matters most?"
  // is off-key under urgency. Skip it and weight fast-turnaround when the trade's bank carries the
  // axis (evidence-tagged firms only, so the re-order stays data-true).
  if (/emergency/.test(jobValue)){
    const fast = b && b.axes && b.axes.some(a => a.axis==='fast');
    applyMatch(jobValue, fast ? 'fast' : null);
    return;
  }
  const hasQ2 = b && b.axes && b.axes.length >= 2;   // ask Q2 only when the trade has real differentiation
  if (hasQ2){ S.matchStep='priority'; renderMatchWalk(); }
  else applyMatch(jobValue, null);
}
function applyMatch(job, axis){
  S.match = { job:job, axis:axis||null };
  S.matchPending=false; _pendingJob=null;
  saveLastMatch(S.activeTrade, job, axis);   // return loop: remember this match so it can be resumed
  logMatch(S.activeTrade, job, axis);
  showBrowse(S.activeTrade);
}
function skipMatch(){
  S.match=null; S.matchPending=false; _pendingJob=null;
  logMatch(S.activeTrade, null, null);
  showBrowse(S.activeTrade);
}
// Resume a stored match (return loop): rehydrate S.match from localStorage and open the
// tailored result — the wiring behind the "pick up where you left off" chip. Defensive:
// bails (returns false) if the bank isn't loaded yet or the stored job no longer exists,
// so the UI only ever offers a resume that actually works. Does NOT re-log a 'match' event
// — a resume is its own signal (wired in the UI layer), never a duplicate match.
function resumeMatch(){
  const m = lastMatch();
  if(!m || !tradeMatchable(m.trade)) return false;
  const b = tradeBank(m.trade);
  if(!(b && b.jobs && b.jobs.some(j => j.value === m.job))) return false;
  S.mode='trade'; S.activeTrade=m.trade;
  S.feedTown=''; S.feedNeeds=new Set(); S.feedSort='rank';
  S.match = { job:m.job, axis:m.axis||null };
  S.matchPending=false;
  logResume(m.trade, m.job, m.axis);   // return-loop signal — a resume, never a duplicate 'match'
  showBrowse(m.trade);
  return true;
}
// ── Instrumentation (Stage 1.4 — LIVE) ──────────────────────────────────────
// Records the demand funnel: match (Q1 job + Q2 axis) → profile view → request.
// No PII — an anonymous per-visit session id threads the funnel; the endpoint
// attaches homeowner_id only if signed in, never an IP, never a rating (the moat).
// Fire-and-forget: a logging hiccup never breaks or slows the app. Endpoint = the
// home edge fn, POST /vesta-event.
const MATCH_EVENTS_LIVE = true;
const VS_SID = (function(){ try { let s = sessionStorage.getItem('v_sid'); if(!s){ s = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('v_sid', s); } return s; } catch(_){ return null; } })();
function logEvent(kind, fields){
  if (!MATCH_EVENTS_LIVE || !window.HOME || !HOME.api) return;
  try { HOME.api('/vesta-event', { method:'POST', body: Object.assign({ kind:kind, session:VS_SID }, fields||{}) }).catch(()=>{}); } catch(_){}
}
function logMatch(appTrade, job, axis){ logEvent('match', { trade:(TRADE_DB[appTrade]||appTrade)||null, job:job||null, axis:axis||null }); }
function logView(placeId, appTrade){ if(placeId) logEvent('profile_view', { place_id:placeId, trade:(TRADE_DB[appTrade]||appTrade)||null }); }
function logRequest(placeId, appTrade){ if(placeId) logEvent('request', { place_id:placeId, trade:(TRADE_DB[appTrade]||appTrade)||null }); }
function logResume(appTrade, job, axis){ logEvent('resume', { trade:(TRADE_DB[appTrade]||appTrade)||null, job:job||null, axis:axis||null }); }

/* INIT */
(function init(){
  renderHome(); renderSidebar(); initSheetDrag();
  const _loads = Promise.all([loadContractors(), loadMatchBank()]);
  syncLikes();
  updateNavState();
  $('btn-back').addEventListener('click', goHome);
  { const mb=$('match-back'); if(mb) mb.addEventListener('click', goHome); }
  $('nav-home').addEventListener('click', () => { if (S.screen!=='home' || S.mode!=='trade'){ S.mode='trade'; goHome(); } });
  $('act-rewind').addEventListener('click', rewindDeck);
  $('act-pass').addEventListener('click', () => { const c=topCon(); if(c) commit('pass', c); });
  $('act-save').addEventListener('click', () => { const c=topCon(); if(c) commit('save', c); });
  $('pscrim').addEventListener('click', closeSheet);
  $('psheet-x').addEventListener('click', closeSheet);
  $('tb-filter').addEventListener('click', openFilterSheet);
  $('fscrim').addEventListener('click', closeFilterSheet);
  $('fsheet-x').addEventListener('click', closeFilterSheet);
  ['nav-search','ds-search','home-search'].forEach(id => { const el=$(id); if(el) el.addEventListener('click', openSearch); });
  ['nav-saved','ds-saved'].forEach(id => { const el=$(id); if(el) el.addEventListener('click', showSaved); });
  ['nav-you','ds-you'].forEach(id => { const el=$(id); if(el) el.addEventListener('click', goAccount); });
  $('vsearch-x').addEventListener('click', closeSearch);
  $('vsearch-input').addEventListener('input', e => renderSearchResults(e.target.value));
  $('vsearch').addEventListener('click', e => { if (e.target===$('vsearch')) closeSearch(); });
  document.addEventListener('keydown', e => {
    if (e.key==='Escape') { closeFeedMenus(); if (S.filterOpen){ closeFilterSheet(); return; } if (S.searchOpen){ closeSearch(); return; } if (S.sheetOpen){ closeSheet(); return; } }
    if (S.screen==='browse' && S.mode==='trade' && !S.sheetOpen && !S.searchOpen && !desktop()){
      const c = topCon();
      if (e.key==='ArrowRight' && c){ e.preventDefault(); commit('save', c); }
      else if (e.key==='ArrowLeft' && c){ e.preventDefault(); commit('pass', c); }
    }
  });
  // feed overflow menus close on any outside click
  document.addEventListener('click', e => { if(!e.target.closest('.fcard-menu')) closeFeedMenus(); });
  // "See full profile" links open the profile in-app (tier 3). Keep the href so
  // middle-click / cmd-click / no-JS still open /c/:id in a new tab.
  document.addEventListener('click', e => {
    const a = e.target.closest('a.va-full, a.fc-fullpill');
    if (!a) return;
    if (e.button!==0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const id = a.getAttribute('data-place'); if (!id) return;
    e.preventDefault(); openProfile(id);
  });
  // re-render the browse view when the layout crosses the desktop/mobile boundary — the
  // deck (mobile) and feed (desktop) are different DOM shapes for the same data.
  let _wasDesktop = desktop();
  window.addEventListener('resize', () => {
    const d = desktop(); if (d===_wasDesktop) return; _wasDesktop = d;
    if (S.screen==='browse'){ if (S.mode==='saved') renderSaved(); else { showDeck(); updateBrowseHead(); renderDeck(); } }
  });
  // Deep-link: /c/:placeId (now rewritten to this app) or ?place= opens the profile in-app.
  const dm = location.pathname.match(/^\/c\/([A-Za-z0-9_-]{8,200})\/?$/);
  const pq = (new URLSearchParams(location.search).get('place')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,200);
  const deepId = dm ? dm[1] : (pq.length>=8 ? pq : null);
  if (deepId) openProfile(deepId);
  // Deep-link: ?q= runs the same problem→job routing as the search box, once the bank is
  // loaded (routeJobSeed only offers seeds the live bank honors). Directory facet links use
  // this to land in the match flow with the need preselected; trade-only falls back to browse.
  const qq = (new URLSearchParams(location.search).get('q')||'').replace(/[^\w\s&+-]/g,' ').slice(0,80).trim();
  if (!deepId && qq) _loads.then(() => {
    const seed = routeJobSeed(qq.toLowerCase());
    if (seed) enterMatch(seed.trade, { job: seed.job });
    else { const t = routeProblem(qq); if (t) openBrowse(t, { hi: queryHi(qq), hiLabel: qq.slice(0,28) }); }
  });
})();
</script>
