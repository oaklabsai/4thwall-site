<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas Workspace — 4THWALL</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ECEDE2">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream:#ECEDE2; --cream-2:#E6E7DA; --paper:#F6F5EE;
      --ink:#12100E; --ink-2:#30321C; --olive:#4A4B2F; --khaki:#6B654B; --tea:#D4DF9E;
      --serif:"Fraunces",serif; --body:"Inter Tight",sans-serif; --mono:"JetBrains Mono",monospace;
      --shadow-sm:6px 6px 14px rgba(48,50,28,.10),-6px -6px 14px rgba(255,255,255,.75);
      --shadow-in:inset 3px 3px 8px rgba(48,50,28,.10),inset -3px -3px 8px rgba(255,255,255,.8);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .shell{display:grid;grid-template-columns:236px 1fr;gap:1.4rem;max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 3rem;min-height:100vh}

    /* ── sidebar ─────────────────────────────────────────── */
    .side{background:var(--cream-2);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:1.15rem 1rem;align-self:start;position:sticky;top:1.2rem}
    .brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;margin:0 0 1.1rem .2rem}
    .brand svg{width:20px;height:20px;color:var(--ink)}
    .brand b{font-weight:600;font-size:.92rem;letter-spacing:.01em}
    .brand span{font-family:var(--serif);font-style:italic;color:var(--olive);font-size:.92rem}
    .side h4{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--khaki);font-size:.86rem;margin:1.05rem .2rem .45rem}
    .snav{display:flex;flex-direction:column;gap:2px}
    .snav button,.snav a{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:.85rem;color:var(--ink-2);padding:.5rem .6rem;border-radius:11px;cursor:pointer;text-decoration:none}
    .snav button:hover,.snav a:hover{background:rgba(255,255,255,.55)}
    .snav .on{background:var(--paper);box-shadow:var(--shadow-sm);font-weight:600;color:var(--ink)}
    .snav .quiet{color:var(--khaki)}
    .snav .quiet i{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--khaki);opacity:.75}
    .side .foot{margin-top:1.2rem;padding:.8rem .2rem 0;border-top:1px solid rgba(74,75,47,.15);font-size:.76rem;color:var(--khaki)}
    .side .foot button{border:0;background:none;font:inherit;color:var(--olive);text-decoration:underline;cursor:pointer;padding:0;margin-top:.25rem}

    /* ── main ────────────────────────────────────────────── */
    .main{min-width:0}
    .kicker{font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);margin:.4rem 0 .3rem}
    h1{font-family:var(--serif);font-weight:500;font-size:1.9rem;margin:0 0 .25rem}
    h1 em{font-style:italic;color:var(--olive);font-weight:400}
    .sub{color:var(--khaki);font-size:.92rem;margin:0 0 1.2rem}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
    .card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:1.2rem 1.3rem}
    .card.wide{grid-column:1/-1}
    .card h2{font-family:var(--serif);font-weight:500;font-size:1.15rem;margin:0 0 .2rem}
    .card .why{color:var(--khaki);font-size:.8rem;margin:0 0 .85rem}
    .quietnote{color:var(--khaki);font-size:.85rem;line-height:1.5;margin:.4rem 0 0}
    .chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.5rem 0 0}
    .chip{background:var(--cream-2);box-shadow:var(--shadow-sm);border-radius:999px;padding:.34rem .75rem;font-size:.78rem;color:var(--ink-2)}
    .chip.tea{background:linear-gradient(180deg,#DCE5B0,var(--tea));color:var(--ink)}
    .synth{font-family:var(--serif);font-size:1.02rem;line-height:1.62;color:var(--ink-2);margin:.5rem 0 0}
    .sigline{font-style:italic;color:var(--olive);margin:.65rem 0 0;font-family:var(--serif)}
    .statrow{display:flex;gap:1rem;flex-wrap:wrap;margin:.6rem 0 0}
    .stat{background:var(--cream-2);border-radius:14px;box-shadow:var(--shadow-sm);padding:.7rem 1rem;min-width:118px}
    .stat b{display:block;font-family:var(--serif);font-size:1.35rem;font-weight:600}
    .stat span{font-size:.72rem;color:var(--khaki)}
    .list{list-style:none;margin:.5rem 0 0;padding:0;display:flex;flex-direction:column;gap:.45rem}
    .list li{display:flex;gap:.6rem;align-items:baseline;font-size:.88rem;line-height:1.45}
    .list .tick{font-family:var(--mono);font-size:.8rem}
    .done .tick{color:var(--olive)} .todo .tick{color:#A2743B}
    .badge{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:.34rem .7rem}
    .badge.owner{background:var(--tea);color:var(--ink)}
    .badge.pending{background:var(--cream-2);box-shadow:var(--shadow-in);color:#A2743B}
    .watchcard{background:var(--ink);color:var(--cream);}
    .watchcard h2,.watchcard .synth{color:var(--cream)}
    .watchcard .why{color:rgba(236,237,226,.6)}
    .watchcard .wi{border-left:2px solid var(--tea);padding:.15rem 0 .15rem .85rem;margin:.75rem 0}
    .watchcard .wi b{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tea);margin-bottom:.25rem}
    .watchcard .wi p{margin:0;font-size:.9rem;line-height:1.55;color:rgba(246,245,238,.92)}
    .watchcard .lock{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tea);margin:0 0 .5rem}
    .locked{box-shadow:var(--shadow-in);background:var(--cream-2)}
    .locked p{margin:.3rem 0 0;color:var(--khaki);font-size:.88rem;line-height:1.5}
    .entr{display:flex;justify-content:space-between;gap:.8rem;font-size:.87rem;padding:.45rem 0;border-bottom:1px dashed rgba(74,75,47,.18)}
    .entr:last-child{border-bottom:0}
    .entr span{color:var(--khaki);font-size:.78rem;white-space:nowrap}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-top:.6rem}
    .split h3{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin:0 0 .4rem}
    .doorline{margin-top:.9rem;font-size:.85rem;color:var(--khaki)}
    .doorline a{font-family:var(--serif);font-style:italic;color:var(--olive)}
    /* offer panel */
    .veil{position:fixed;inset:0;background:rgba(18,16,14,.35);display:none;place-items:center;z-index:40;padding:1rem}
    .veil.show{display:grid}
    .offer{background:var(--paper);border-radius:var(--radius);box-shadow:0 24px 60px rgba(18,16,14,.35);max-width:430px;width:100%;padding:1.5rem 1.6rem}
    .offer h3{font-family:var(--serif);font-weight:500;font-size:1.25rem;margin:0 0 .5rem}
    .offer p{font-size:.92rem;line-height:1.6;color:var(--ink-2);margin:0 0 1rem}
    .offer .close{border:0;background:var(--cream-2);box-shadow:var(--shadow-sm);border-radius:11px;padding:.55rem .95rem;font:inherit;font-size:.85rem;cursor:pointer}
    .skeleton{color:var(--khaki);font-family:var(--serif);font-style:italic;padding:3rem 0;text-align:center}
    .toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--cream);border-radius:12px;padding:.6rem 1.1rem;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:60}
    .toast.show{opacity:1;transform:translateX(-50%)}
    @media (max-width:880px){
      .shell{grid-template-columns:1fr;padding:1rem .9rem 2.4rem}
      .side{position:static;display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .6rem;padding:.85rem .9rem}
      .side h4{width:100%;margin:.5rem 0 .2rem}
      .snav{flex-direction:row;flex-wrap:wrap;gap:.35rem}
      .snav button,.snav a{width:auto;padding:.42rem .7rem;background:var(--cream)}
      .snav .quiet i{display:none}
      .side .foot{width:100%;margin-top:.6rem;padding-top:.6rem}
      .grid,.split{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="/atlas">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="square" aria-hidden="true"><polyline points="94.5,5.5 5.5,5.5 5.5,94.5 70,94.5"/><line x1="94.5" y1="5.5" x2="94.5" y2="70"/></svg>
        <b>4THWALL</b><span>Atlas</span>
      </a>
      <h4>The office</h4>
      <nav class="snav" id="nav-office"></nav>
      <h4>Your setup</h4>
      <nav class="snav">
        <button class="on" type="button">Your record</button>
        <a href="/workspace/onboarding">Your business</a>
      </nav>
      <div class="foot">
        <div id="who">Signed in</div>
        <button type="button" id="signout">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div id="app" class="skeleton">Opening your Atlas…</div>
    </main>
  </div>

  <div class="veil" id="veil" role="dialog" aria-modal="true">
    <div class="offer">
      <h3 id="offer-title"></h3>
      <p id="offer-body"></p>
      <p class="doorline" id="offer-door"></p>
      <button class="close" type="button" id="offer-close">Close</button>
    </div>
  </div>

  <div class="toast" id="workspace-toast" role="status"></div>
  <script src="/workspace.js" defer></script>
</body>
</html>
